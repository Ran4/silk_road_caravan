<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silk Road Caravan Prototype</title>
  <style>
    body { font-family: sans-serif; background: #faf0e6; margin: 0; display: flex; height: 100vh; }
    #map { flex: 1; background: #fff8f0; position: relative; }
    canvas { display: block; margin: auto; cursor: pointer; }
    #zoom-toggle { position: absolute; top: 10px; right: 10px; background: rgba(245, 224, 195, 0.9); border: 1px solid #c69c6d; border-radius: 4px; padding: 0.3em 0.6em; cursor: pointer; font-size: 0.8em; z-index: 5; }
    #zoom-toggle:hover { background: rgba(232, 209, 179, 0.9); }
    #sidebar { width: 440px; background: #f5f0eb; padding: 1em; box-shadow: -2px 0 5px rgba(0,0,0,0.1); overflow-y: auto; position: relative; font-size: 1em; transition: width 0.3s ease; }
    #sidebar.zoomed { font-size: 1.1em; width: 500px; }
    #sidebar.zoomed button { font-size: 1.1em; padding: 0.33em 0.66em; }
    #sidebar.zoomed input[type="number"] { font-size: 1.1em; }
    h1 { text-align: center; margin: 0 0 1em; color: #8b4513; }
    .stats div, .prices div { margin: 0.5em 0; }
    .trade-row { display: flex; justify-content: space-between; margin: 0.5em 0; }
    .actions div { margin-top: 1em; color: #555; font-size: 0.9em; }
    button { padding: 0.3em 0.6em; border-radius: 4px; border: 1px solid #c69c6d; background: #f5e0c3; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #e8d1b3; }
    button:disabled { background: #ddd; color: #999; cursor: not-allowed; }
    #log { height: 120px; overflow-y: auto; border-top: 1px solid #d3bfa6; padding-top: 0.5em; margin-top: 1em; font-size: 0.9em; background: #fff; border-radius: 4px; padding: 0.5em; }
    #toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 0.5em 1em; background: rgba(0,0,0,0.7); color: #fff; border-radius: 4px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10; }
    .section { margin-bottom: 1em; padding: 0.5em; background: rgba(255,255,255,0.3); border-radius: 4px; }
    .section h3 { margin: 0 0 0.5em; color: #8b4513; }
    input[type="number"] { width: 50px; padding: 0.2em; border: 1px solid #c69c6d; border-radius: 3px; }
    /* Guild Panel */
    #guild-panel { display: none; position: absolute; bottom: 1em; left: 50%; transform: translateX(-50%); background: rgba(245, 235, 220, 0.95); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 20; padding: 0.75em 1em; box-sizing: border-box; max-width: calc(100% - 2em); }
    #guild-panel.visible { display: block; }
    .guild-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4em; }
    .guild-header h2 { margin: 0; color: #8b4513; font-size: 1.1em; }
    .guild-close { background: none; color: #888; border: none; padding: 0.2em 0.5em; cursor: pointer; font-size: 1.1em; }
    .guild-close:hover { color: #333; }
    #guild-standing { margin-bottom: 0.5em; font-style: italic; color: #666; font-size: 0.9em; }
    #guild-services { display: flex; flex-wrap: wrap; gap: 0.4em; }
    .guild-service { background: #fff; border: 1px solid #c69c6d; border-radius: 4px; padding: 0.3em 0.7em; cursor: pointer; }
    .guild-service:hover:not(.locked):not(.used) { background: #e8d1b3; }
    .guild-service.locked { opacity: 0.5; cursor: not-allowed; }
    .guild-service.used { opacity: 0.6; background: #d0d0d0; cursor: not-allowed; }
    .guild-service .service-name { font-weight: bold; font-size: 0.9em; }
    .guild-service .service-price { color: #228b22; font-size: 0.85em; }
    .guild-service .service-desc { font-size: 0.75em; color: #666; }
    #guild-donate { margin-top: 0.5em; padding-top: 0.4em; border-top: 1px solid #c69c6d; font-size: 0.9em; }
  </style>
</head>
<body>
  <div id="map">
    <button id="zoom-toggle" onclick="toggleZoom()">1x</button>
    <canvas id="canvas" width="900" height="900"></canvas>
    <div id="guild-panel">
      <div class="guild-header">
        <h2 id="guild-name"></h2>
        <button class="guild-close" onclick="closeGuildPanel()">✕ Close</button>
      </div>
      <div id="guild-standing"></div>
      <div id="guild-services"></div>
      <div id="guild-donate"></div>
    </div>
  </div>
  <div id="sidebar">
    <div id="toast"></div>
    <h1>🐪 Silk Road Caravan</h1>
    <div class="section">
      <h3>📊 Status</h3>
      <div class="stats" id="stats"></div>
    </div>
    <div class="section" id="trade-section" style="display: none;">
      <h3>🏪 Trading Post</h3>
      <div id="trade-controls"></div>
    </div>
    <div class="section">
      <h3>🎯 Actions</h3>
      <div class="actions" id="actions"></div>
    </div>
    <div class="section">
      <h3>📜 Journey Log</h3>
      <div id="log"></div>
    </div>
    <div class="section">
      <h3>🎒 Items</h3>
      <div id="items-list"></div>
    </div>
    <div class="section">
      <h3>🗺️ Cities Visited</h3>
      <div id="cities-checklist"></div>
    </div>
  </div>
  <script>
    let toastTimeout;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = 1;
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { t.style.opacity = 0; }, 1500);
    }

    function addLog(msg) {
      const log = document.getElementById('log');
      const div = document.createElement('div');
      div.textContent = msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    const GRID_RADIUS = 6;
    const HOURS_PER_DAY = 24;
    const size = 40;
    const widthHex = size * Math.sqrt(3);
    const heightHex = size * 2;
    const vert = heightHex * 3/4;
    const coords = [];
    for (let q = -GRID_RADIUS; q <= GRID_RADIUS; q++) {
      for (let r = -GRID_RADIUS; r <= GRID_RADIUS; r++) {
        if (Math.abs(q + r) <= GRID_RADIUS) coords.push({ q, r });
      }
    }

    function hexToPixel(q, r) {
      return { 
        x: widthHex * (q + r/2) * state.zoom + canvas.width/2, 
        y: vert * r * state.zoom + canvas.height/2 
      };
    }
    function hexDistance(a, b) {
      return (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs((a.q + a.r) - (b.q + b.r))) / 2;
    }
    function pixelToHex(x, y) {
      const offsetX = (x - canvas.width/2) / state.zoom;
      const offsetY = (y - canvas.height/2) / state.zoom;
      const q = (Math.sqrt(3)/3 * offsetX - 1/3 * offsetY) / size;
      const r = (2/3 * offsetY) / size;
      return axialRound(q, r);
    }
    function axialRound(q, r) {
      const s = -q - r;
      let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
      const qdiff = Math.abs(rq - q), rdiff = Math.abs(rr - r), sdiff = Math.abs(rs - s);
      if (qdiff > rdiff && qdiff > sdiff) rq = -rr - rs;
      else if (rdiff > sdiff) rr = -rq - rs;
      return { q: rq, r: rr };
    }

    function getViewDistance() {
      return state.items.has('map_scrolls') ? 3 : 2;
    }
    function getNeighbors(pos) {
      return coords.filter(c => hexDistance(c, pos) === 1);
    }

    const cities = [
      { q: 0, r: 0, name: "Chang'an", emoji: "🏛️" },
      { q: 3, r: 0, name: 'Samarkand', emoji: "🕌" },
      { q: 6, r: -6, name: 'Antioch', emoji: "⛪" },
      { q: -3, r: 4, name: 'Kashgar', emoji: "🏰" },
      { q: -5, r: -1, name: 'Delhi', emoji: "🏘️" },
      { q: 2, r: 4, name: 'Tashkent', emoji: "🏙️" },
      { q: -2, r: -4, name: 'Bukhara', emoji: "🕌" },
      { q: 5, r: 1, name: 'Baghdad', emoji: "🕌" },
      { q: -4, r: -2, name: 'Merv', emoji: "🏛️" }
    ];

    const oases = [
      { q: 3, r: 2, name: "Desert Oasis", emoji: "🌴" },
      { q: -2, r: 3, name: "Palm Springs", emoji: "🌴" },
      { q: 2, r: -3, name: "Mirage Wells", emoji: "🌴" },
      { q: -3, r: -3, name: "Caravan Rest", emoji: "🌴" },
      { q: 4, r: -5, name: "Golden Sands", emoji: "🌴" },
      { q: -1, r: 5, name: "Emerald Pool", emoji: "🌴" }
    ];

    const waterTiles = [
      { q: 6, r: -5 },
      { q: 6, r: -4 },
      { q: 6, r: -3 },
      { q: 5, r: -4 },
      { q: 1, r: 1 },
      { q: 1, r: 2 },
      { q: 2, r: 1 },
      { q: -1, r: -2 },
      { q: 0, r: -2 },
      // Near Samarkand
      { q: 4, r: -3 },
      { q: 3, r: -2 },
      { q: 3, r: -1 },
      { q: 2, r: 0 },
      // Near Baghdad (Tigris)
      { q: 5, r: 0 },
      { q: 4, r: 1 },
      { q: 5, r: -1 },
      { q: 3, r: 1 }
    ];

    function getCity(q, r) {
      return cities.find(city => city.q === q && city.r === r);
    }

    function getWater(q, r) {
      return waterTiles.find(w => w.q === q && w.r === r);
    }

    const gameItems = [
      { id: 'compass', name: 'Compass', price: 30, description: 'Reduces movement cost by 1 (minimum 1) for all desert tiles' },
      { id: 'food_preserves', name: 'Food Preserves', price: 24, description: 'Increases maximum food capacity to 35' },
      { id: 'silk_bags', name: 'Silk Bags', price: 40, description: 'Increases cargo capacity to 30 items' },
      { id: 'map_scrolls', name: 'Map Scrolls', price: 36, description: 'Increases view distance to 3 hexes' },
      { id: 'camel_shoes', name: 'Camel Shoes', price: 20, description: 'Movement to cities and oases costs no supplies' },
      { id: 'boat', name: 'Boat', price: 50, description: 'Allows crossing water tiles (rivers, lakes, seas)' }
    ];

    const guildTypes = {
      caravan: {
        name: 'Caravan Guild',
        emoji: '🐪',
        services: [
          { id: 'route_info', name: 'Route Information', desc: 'Reveal path wear on visible tiles', price: 10, repGain: 2, minRep: 0 },
          { id: 'camel_blessing', name: 'Camel Blessing', desc: 'Next 20 moves cost 1 less food', price: 25, repGain: 5, minRep: 20 }
        ]
      },
      explorers: {
        name: 'Explorers Guild',
        emoji: '🧭',
        services: [
          { id: 'reveal_terrain', name: 'Reveal Terrain', desc: 'Show hexes within 5 tiles of this city', price: 15, repGain: 3, minRep: 0, oneTime: true },
          { id: 'explorer_discount', name: 'Explorer Discount', desc: '50% off compass, map scrolls, boat everywhere', price: 30, repGain: 5, minRep: 20, oneTime: true },
          { id: 'oasis_map', name: 'Oasis Map', desc: 'Mark all oases on your map', price: 40, repGain: 8, minRep: 50, oneTime: true }
        ]
      },
      merchants: {
        name: 'Merchants Guild',
        emoji: '💰',
        services: [
          { id: 'price_report', name: 'Price Report', desc: 'View prices at 3 random cities', price: 8, repGain: 2, minRep: 0 },
          { id: 'market_manipulation', name: 'Market Manipulation', desc: 'Increase price of a good by 2 here', price: 20, repGain: 4, minRep: 20 }
        ]
      },
      smugglers: {
        name: 'Smugglers Guild',
        emoji: '🗡️',
        services: [
          { id: 'contraband_tip', name: 'Contraband Tip', desc: 'Reveals highest price for a random good', price: 12, repGain: 3, minRep: 0 },
          { id: 'bribe_guards', name: 'Bribe Guards', desc: '+20 rep with another guild (7-day cooldown)', price: 50, repGain: 0, minRep: 30 }
        ]
      }
    };

    function assignGuildsToCity() {
      const guildList = ['caravan', 'explorers', 'merchants', 'smugglers'];
      const shuffledCities = [...cities].sort(() => Math.random() - 0.5);
      state.cityGuilds = {};
      guildList.forEach((guild, i) => {
        if (shuffledCities[i]) {
          state.cityGuilds[shuffledCities[i].name] = guild;
        }
      });
      // Randomize donation rates (1-10 rep per 20 dirhams)
      guildList.forEach(g => {
        state.guildDonationRates[g] = Math.floor(Math.random() * 10) + 1;
      });
    }

    function getReputationLevel(rep) {
      if (rep <= -50) return { name: 'Shunned', canUse: false, message: 'The guild members flee at your approach!' };
      if (rep < 0) return { name: 'Suspect', canUse: false, message: 'The guild refuses to deal with you.' };
      if (rep < 20) return { name: 'Stranger', canUse: true, discount: 0 };
      if (rep < 50) return { name: 'Known', canUse: true, discount: 0 };
      if (rep < 80) return { name: 'Trusted', canUse: true, discount: 0.1 };
      return { name: 'Honored', canUse: true, discount: 0.2 };
    }

    function getGuildForCurrentCity() {
      const city = getCity(state.pos.q, state.pos.r);
      if (!city) return null;
      const guildType = state.cityGuilds[city.name];
      if (!guildType) return null;
      return { type: guildType, city: city.name, ...guildTypes[guildType] };
    }

    function showGuildPanel() {
      const guild = getGuildForCurrentCity();
      if (!guild) return;

      const rep = state.guildReputation[guild.type];
      const level = getReputationLevel(rep);

      document.getElementById('guild-name').textContent = `${guild.emoji} ${guild.name}`;

      if (!level.canUse) {
        document.getElementById('guild-standing').textContent = `Standing: ${level.name} (${rep}) - ${level.message}`;
        document.getElementById('guild-services').innerHTML = '';
        document.getElementById('guild-donate').innerHTML = '';
      } else {
        const discountText = level.discount > 0 ? ` (${Math.round(level.discount * 100)}% discount!)` : '';
        document.getElementById('guild-standing').textContent = `Standing: ${level.name} (${rep})${discountText}`;

        let servicesHtml = '';
        guild.services.forEach(service => {
          const isLocked = rep < service.minRep;
          const isUsed = service.oneTime && state.usedServices.has(service.id);
          const currentDay = Math.floor(state.time / HOURS_PER_DAY);
          const isOnCooldown = service.id === 'bribe_guards' && (currentDay - state.guildEffects.lastBribeDay < 7);
          const cooldownDays = isOnCooldown ? 7 - (currentDay - state.guildEffects.lastBribeDay) : 0;
          const price = Math.round(service.price * (1 - level.discount));
          const canAfford = state.funds >= price;

          let classes = 'guild-service';
          if (isLocked) classes += ' locked';
          if (isUsed || isOnCooldown) classes += ' used';

          let statusText = '';
          if (isLocked) statusText = ` [Need ${service.minRep} rep]`;
          else if (isUsed) statusText = ' [Already used]';
          else if (isOnCooldown) statusText = ` [${cooldownDays} day${cooldownDays > 1 ? 's' : ''} cooldown]`;

          const canUse = !isLocked && !isUsed && !isOnCooldown && canAfford;
          servicesHtml += `
            <div class="${classes}" onclick="${canUse ? `useGuildService('${service.id}')` : ''}">
              <div class="service-name">${service.name}${statusText}</div>
              <div class="service-price">${price} dirhams</div>
              <div class="service-desc">${service.desc}</div>
            </div>
          `;
        });
        document.getElementById('guild-services').innerHTML = servicesHtml;

        const donateRate = state.guildDonationRates[guild.type];
        document.getElementById('guild-donate').innerHTML = `
          <button onclick="donateToGuild()" ${state.funds < 20 ? 'disabled' : ''}>
            Donate 20 dirhams (+${donateRate} reputation)
          </button>
        `;
      }

      document.getElementById('guild-panel').classList.add('visible');
    }

    function closeGuildPanel() {
      document.getElementById('guild-panel').classList.remove('visible');
    }

    function donateToGuild() {
      const guild = getGuildForCurrentCity();
      if (!guild || state.funds < 20) return;

      state.funds -= 20;
      const gain = state.guildDonationRates[guild.type];
      state.guildReputation[guild.type] = Math.min(100, state.guildReputation[guild.type] + gain);
      addLog(`Donated 20 dirhams to ${guild.name} (+${gain} reputation)`);
      showGuildPanel();
      updateUI();
    }

    function useGuildService(serviceId) {
      const guild = getGuildForCurrentCity();
      if (!guild) return;

      const service = guild.services.find(s => s.id === serviceId);
      if (!service) return;

      const rep = state.guildReputation[guild.type];
      const level = getReputationLevel(rep);
      if (!level.canUse || rep < service.minRep) return;
      if (service.oneTime && state.usedServices.has(serviceId)) return;

      const price = Math.round(service.price * (1 - level.discount));
      if (state.funds < price) {
        showToast('Not enough funds!');
        return;
      }

      state.funds -= price;
      state.guildReputation[guild.type] = Math.min(100, rep + service.repGain);
      if (service.oneTime) state.usedServices.add(serviceId);

      // Execute service effect
      switch (serviceId) {
        case 'route_info': useRouteInfo(); break;
        case 'camel_blessing': useCamelBlessing(); break;
        case 'reveal_terrain': useRevealTerrain(guild.city); break;
        case 'explorer_discount': useExplorerDiscount(); break;
        case 'oasis_map': useOasisMap(); break;
        case 'price_report': usePriceReport(); break;
        case 'market_manipulation': useMarketManipulation(); break;
        case 'contraband_tip': useContrabandTip(); break;
        case 'bribe_guards': useBribeGuards(); break;
      }

      addLog(`Used ${service.name} from ${guild.name}`);
      showGuildPanel();
      updateUI();
      drawMap();
    }

    // Service implementations
    function useRouteInfo() {
      const viewDist = getViewDistance();
      let info = 'Path wear: ';
      coords.forEach(c => {
        if (hexDistance(c, state.pos) <= viewDist) {
          const wear = getPathWear(c.q, c.r);
          if (wear > 0) {
            info += `(${c.q},${c.r}):${wear} `;
          }
        }
      });
      addLog(info || 'No worn paths nearby.');
      showToast('Path wear revealed in log!');
    }

    function useCamelBlessing() {
      state.guildEffects.camelBlessing = 20;
      showToast('Camel Blessing active for 20 moves!');
    }

    function useRevealTerrain(cityName) {
      if (!state.guildEffects.revealedCities.includes(cityName)) {
        state.guildEffects.revealedCities.push(cityName);
      }
      showToast(`Terrain around ${cityName} revealed!`);
    }

    function useExplorerDiscount() {
      state.guildEffects.explorerDiscount = true;
      showToast('50% off explorer items permanently!');
    }

    function useOasisMap() {
      state.guildEffects.oasisMapRevealed = true;
      showToast('All oases marked on map!');
    }

    function usePriceReport() {
      const currentCity = getCity(state.pos.q, state.pos.r);
      const otherCities = cities.filter(c => c.name !== currentCity?.name);
      const selected = otherCities.sort(() => Math.random() - 0.5).slice(0, 3);

      selected.forEach(city => {
        const prices = state.cityPrices[city.name];
        const dist = hexDistance(city, state.pos);
        addLog(`${city.name} (${dist} away): Silk ${prices.silk}, Spices ${prices.spices}, Pottery ${prices.pottery}`);
      });
      showToast('Price report in log!');
    }

    function useMarketManipulation() {
      const goods = ['silk', 'spices', 'pottery'];
      const good = goods[Math.floor(Math.random() * goods.length)];
      const city = getCity(state.pos.q, state.pos.r);
      if (city && state.cityPrices[city.name]) {
        state.cityPrices[city.name][good] += 2;
        state.prices[good] += 2;
        addLog(`${good.charAt(0).toUpperCase() + good.slice(1)} price increased by 2 in ${city.name}!`);
        showToast(`${good} price +2!`);
      }
    }

    function useContrabandTip() {
      const goods = ['silk', 'spices', 'pottery'];
      const good = goods[Math.floor(Math.random() * goods.length)];
      let bestCity = null;
      let bestPrice = 0;

      cities.forEach(city => {
        const price = state.cityPrices[city.name]?.[good] || 0;
        if (price > bestPrice) {
          bestPrice = price;
          bestCity = city;
        }
      });

      if (bestCity) {
        addLog(`Tip: ${good.charAt(0).toUpperCase() + good.slice(1)} sells for ${bestPrice} in ${bestCity.name}!`);
        showToast(`${good} best at ${bestCity.name}!`);
      }
    }

    function useBribeGuards() {
      const currentDay = Math.floor(state.time / HOURS_PER_DAY);
      if (currentDay - state.guildEffects.lastBribeDay < 7) {
        showToast('Bribe cooldown not ready!');
        return;
      }

      const guild = getGuildForCurrentCity();
      const otherGuilds = Object.keys(guildTypes).filter(g => g !== guild?.type);
      const targetGuild = otherGuilds[Math.floor(Math.random() * otherGuilds.length)];

      state.guildReputation[targetGuild] = Math.min(100, state.guildReputation[targetGuild] + 20);
      state.guildEffects.lastBribeDay = currentDay;
      addLog(`Bribed guards: +20 reputation with ${guildTypes[targetGuild].name}!`);
      showToast(`+20 rep with ${guildTypes[targetGuild].name}!`);
    }

    function getRandomCityItems() {
      const cityItems = {};
      cities.forEach(city => {
        const numItems = Math.random() < 0.7 ? (Math.random() < 0.5 ? 0 : 1) : Math.random() < 0.6 ? 2 : 3;
        if (numItems > 0) {
          const shuffled = [...gameItems].sort(() => Math.random() - 0.5);
          cityItems[city.name] = shuffled.slice(0, numItems);
        } else {
          cityItems[city.name] = [];
        }
      });
      return cityItems;
    }

    function getOasis(q, r) {
      return oases.find(oasis => oasis.q === q && oasis.r === r);
    }

    function canRest(q, r) {
      return getCity(q, r) || getOasis(q, r);
    }

    let state = {
      funds: 20,
      supplies: { food: 25 },
      reputation: 0,
      cargo: { silk: 0, spices: 0, pottery: 0 },
      pos: { q: 0, r: 0 },
      prices: {},
      cityPrices: {},
      pathWear: {},
      visitedCities: new Set(['Chang\'an']),
      zoom: window.innerWidth > 1100 ? 2 : 1,
      items: new Set(),
      cityItems: {},
      time: 0,
      // Guild system
      guildReputation: { caravan: 10, explorers: 10, merchants: 10, smugglers: 10 },
      guildDonationRates: {},
      cityGuilds: {},
      usedServices: new Set(),
      guildEffects: {
        camelBlessing: 0,
        explorerDiscount: false,
        revealedCities: [],
        oasisMapRevealed: false,
        lastBribeDay: -999
      }
    };
    let lastMove = null;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function getPathWear(q, r) {
      const key = `${q},${r}`;
      return state.pathWear[key] || 0;
    }

    function setPathWear(q, r, value) {
      const key = `${q},${r}`;
      state.pathWear[key] = Math.max(0, Math.min(200, value));
    }

    function updatePathWear() {
      Object.keys(state.pathWear).forEach(key => {
        state.pathWear[key] = Math.max(0, state.pathWear[key] - 1);
        if (state.pathWear[key] === 0) {
          delete state.pathWear[key];
        }
      });
    }

    function getMovementCost(q, r) {
      const city = getCity(q, r);
      const oasis = getOasis(q, r);
      const water = getWater(q, r);

      if (city || oasis) return { food: 1 };
      if (water) return { food: 1 };  // Sailing is easy

      const pathWear = getPathWear(q, r);
      // Cost starts at 5 for untraveled, goes down to 1 for well-traveled (200 wear)
      // Evenly distributed: 0-49=5, 50-99=4, 100-149=3, 150-199=2, 200=1
      let cost = Math.max(1, 5 - Math.floor(pathWear / 40));

      // Apply camel blessing discount
      if (state.guildEffects.camelBlessing > 0) {
        cost = Math.max(1, cost - 1);
      }

      return { food: cost };
    }

    function generateAllCityPrices() {
      cities.forEach(city => {
        const baseSilk = 5 + (city.q + city.r) * 0.5;
        const baseSpices = 3 + (city.q - city.r) * 0.3;
        const basePottery = 4 + Math.abs(city.q) * 0.4;
        state.cityPrices[city.name] = {
          silk: Math.max(1, Math.round(baseSilk + (Math.random() * 2 - 1))),
          spices: Math.max(1, Math.round(baseSpices + (Math.random() * 2 - 1))),
          pottery: Math.max(1, Math.round(basePottery + (Math.random() * 2 - 1)))
        };
      });
    }

    function updateCurrentPrices() {
      const city = getCity(state.pos.q, state.pos.r);
      if (!city) {
        state.prices = {};
      } else {
        state.prices = state.cityPrices[city.name];
      }
    }

    function marketFluctuation() {
      // Affect 1/3 of all cities (rounded up)
      const numCitiesToAffect = Math.ceil(cities.length / 3);
      const shuffledCities = [...cities].sort(() => Math.random() - 0.5);
      const affectedCities = shuffledCities.slice(0, numCitiesToAffect);

      let currentCityAffected = false;
      const currentCity = getCity(state.pos.q, state.pos.r);

      affectedCities.forEach(city => {
        const prices = state.cityPrices[city.name];
        Object.keys(prices).forEach(item => {
          if (Math.random() < 0.9) {
            const delta = Math.random() < 0.5 ? 1 : -1;
            prices[item] = Math.max(1, prices[item] + delta);
          } else {
            const delta = Math.floor((Math.random() * 5 + 1) * (Math.random() < 0.5 ? 1 : -1));
            prices[item] = Math.max(1, prices[item] + delta);
          }
        });

        if (currentCity && currentCity.name === city.name) {
          currentCityAffected = true;
        }
      });

      // Update visible prices if in a city
      updateCurrentPrices();

      // Show notification
      const cityNames = affectedCities.map(city => city.name).join(', ');
      if (currentCityAffected) {
        showToast(`Market prices fluctuated in: ${cityNames}`);
      } else {
        showToast(`Markets changed in: ${cityNames}`);
      }
    }

    function onNewDay() {
      const day = state.time / HOURS_PER_DAY;
      addLog(`--- Day ${day} begins ---`);

      // 80% chance of market fluctuation
      if (Math.random() < 0.8) {
        marketFluctuation();
      }

      // Guild reputation decay toward 10
      Object.keys(state.guildReputation).forEach(guild => {
        const rep = state.guildReputation[guild];
        if (rep > 10) state.guildReputation[guild]--;
        else if (rep < 10) state.guildReputation[guild]++;
      });
    }

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const viewDist = getViewDistance();
      coords.forEach(c => {
        const dist = hexDistance(c, state.pos);
        const { x, y } = hexToPixel(c.q, c.r);

        // Check if visible due to guild effects
        let isVisible = dist <= viewDist;
        if (!isVisible) {
          // Check revealed cities (within 5 tiles)
          for (const cityName of state.guildEffects.revealedCities) {
            const revealedCity = cities.find(city => city.name === cityName);
            if (revealedCity && hexDistance(c, revealedCity) <= 5) {
              isVisible = true;
              break;
            }
          }
          // Check oasis map
          if (state.guildEffects.oasisMapRevealed && getOasis(c.q, c.r)) {
            isVisible = true;
          }
        }

        if (!isVisible) {
          ctx.fillStyle = '#ccc'; ctx.strokeStyle = '#999'; ctx.lineWidth = 1;
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const ang = Math.PI/180 * (60 * i - 30);
            ctx[i === 0 ? 'moveTo' : 'lineTo'](x + size * state.zoom * Math.cos(ang), y + size * state.zoom * Math.sin(ang));
          }
          ctx.closePath(); ctx.fill(); ctx.stroke();
          return;
        }
        
        const city = getCity(c.q, c.r);
        const oasis = getOasis(c.q, c.r);
        const water = getWater(c.q, c.r);
        const current = (c.q === state.pos.q && c.r === state.pos.r);
        const pathWear = getPathWear(c.q, c.r);

        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const ang = Math.PI/180 * (60 * i - 30);
          ctx[i === 0 ? 'moveTo' : 'lineTo'](x + size * state.zoom * Math.cos(ang), y + size * state.zoom * Math.sin(ang));
        }
        ctx.closePath();

        if (city) {
          ctx.fillStyle = current ? '#ffd580' : '#ffe0b3';
        } else if (oasis) {
          ctx.fillStyle = current ? '#90ee90' : '#98fb98';
        } else if (water) {
          ctx.fillStyle = current ? '#6eb8d3' : '#7ec8e3';
        } else {
          let baseColor = current ? '#ffaced' : '#faf0f5';
          
          if (pathWear > 0) {
            const wearIntensity = pathWear / 200;
            const r = parseInt(baseColor.slice(1, 3), 16);
            const g = parseInt(baseColor.slice(3, 5), 16);
            const b = parseInt(baseColor.slice(5, 7), 16);
            
            const brownR = 139;
            const brownG = 69;
            const brownB = 19;
            
            const newR = Math.round(r + (brownR - r) * wearIntensity * 0.4);
            const newG = Math.round(g + (brownG - g) * wearIntensity * 0.4);
            const newB = Math.round(b + (brownB - b) * wearIntensity * 0.4);
            
            ctx.fillStyle = `rgb(${newR}, ${newG}, ${newB})`;
          } else {
            ctx.fillStyle = baseColor;
          }
        }
        
        ctx.fill();
        ctx.lineWidth = current ? 4 : 1;
        ctx.strokeStyle = city ? '#cc9a00' : oasis ? '#228b22' : water ? '#2060a0' : '#c69c6d';
        ctx.stroke();
        
        if (pathWear > 20) {
          ctx.save();
          ctx.globalAlpha = Math.min(0.8, pathWear / 200);
          ctx.strokeStyle = '#8b4513';
          ctx.lineWidth = Math.max(1, pathWear / 50) * state.zoom;
          ctx.beginPath();
          ctx.arc(x, y, size * state.zoom * 0.3, 0, 2 * Math.PI);
          ctx.stroke();
          ctx.restore();
        }
        
        if (lastMove && c.q === lastMove.q && c.r === lastMove.r) {
          ctx.beginPath(); 
          ctx.arc(x, y, size * state.zoom / 2, 0, 2 * Math.PI); 
          ctx.lineWidth = 3 * state.zoom; 
          ctx.strokeStyle = 'gold'; 
          ctx.stroke(); 
          lastMove = null;
        }
        
        if (city) {
          ctx.fillStyle = '#8b4513';
          ctx.font = `${12 * state.zoom}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(city.emoji, x, y - 8 * state.zoom);
          ctx.fillText(city.name, x, y + 8 * state.zoom);
        } else if (oasis) {
          ctx.fillStyle = '#228b22';
          ctx.font = `${12 * state.zoom}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(oasis.emoji, x, y - 8 * state.zoom);
          ctx.fillText(oasis.name, x, y + 8 * state.zoom);
        } else if (water) {
          ctx.fillStyle = '#1a5090';
          ctx.font = `${14 * state.zoom}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText('🌊', x, y + 5 * state.zoom);
        }

        if (current) {
          ctx.fillStyle = '#ff6600';
          ctx.font = `${20 * state.zoom}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText('🐪', x, y + 5 * state.zoom);
        }
      });
    }

    function getTotalCargo() {
      return state.cargo.silk + state.cargo.spices + state.cargo.pottery;
    }

    function getMaxCargo() {
      return state.items.has('silk_bags') ? 30 : 20;
    }

    function getMaxFood() {
      return state.items.has('food_preserves') ? 35 : 25;
    }

    function updateItemsList() {
      const itemsDiv = document.getElementById('items-list');
      if (state.items.size === 0) {
        itemsDiv.innerHTML = '<div style="color: #888; font-style: italic;">No items owned</div>';
      } else {
        itemsDiv.innerHTML = Array.from(state.items).map(itemId => {
          const item = gameItems.find(i => i.id === itemId);
          return `<div style="margin: 0.2em 0; cursor: help;" title="${item.description}">${item.name}</div>`;
        }).join('');
      }
    }
    function updateCitiesChecklist() {
      const checklistDiv = document.getElementById('cities-checklist');
      checklistDiv.innerHTML = cities.map(city => {
        const visited = state.visitedCities.has(city.name);
        return `<div style="${visited ? 'text-decoration: line-through; color: #888;' : ''}">${city.emoji} ${city.name}${visited ? ' ✓' : ''}</div>`;
      }).join('');
    }

    function buyItem(itemId) {
      const item = gameItems.find(i => i.id === itemId);
      if (!item) return;

      if (state.items.has(itemId)) {
        showToast('You already own this item!');
        return;
      }

      // Apply explorer discount for compass, map_scrolls, boat
      let price = item.price;
      const explorerItems = ['compass', 'map_scrolls', 'boat'];
      if (state.guildEffects.explorerDiscount && explorerItems.includes(itemId)) {
        price = Math.round(price * 0.5);
      }

      if (state.funds >= price) {
        state.funds -= price;
        state.items.add(itemId);
        addLog(`Purchased ${item.name} for ${price} dirhams`);
        updateUI();
      } else {
        showToast('Not enough funds!');
      }
    }

    function updateUI() {
      const city = getCity(state.pos.q, state.pos.r);
      const oasis = getOasis(state.pos.q, state.pos.r);
      const locationName = city ? city.name : oasis ? oasis.name : 'Wilderness';
      
      const totalCargo = getTotalCargo();
      const maxCargo = getMaxCargo();
      const maxFood = getMaxFood();
      
      const days = Math.floor(state.time / HOURS_PER_DAY);
      document.getElementById('stats').innerHTML = `
        <div>💰 Funds: ${state.funds} dirhams</div>
        <div>🍞 Food: ${state.supplies.food}/${maxFood}</div>
        <div>⭐ Reputation: ${state.reputation}</div>
        <div>🎒 Cargo (${totalCargo}/${maxCargo}): Silk ${state.cargo.silk}, Spices ${state.cargo.spices}, Pottery ${state.cargo.pottery}</div>
        <div>📍 Location: ${locationName}</div>
        <div>📅 Day: ${days}</div>
      `;
      
      if (city) {
        document.getElementById('trade-section').style.display = 'block';
        
        const cityItemsAvailable = state.cityItems[city.name] || [];
        let itemsHtml = '';
        
        if (cityItemsAvailable.length > 0) {
          itemsHtml = `
            <div style="margin-bottom: 1em; border-top: 1px solid #d3bfa6; padding-top: 0.5em;">
              <h4 style="margin: 0 0 0.5em; color: #8b4513;">Items for Sale</h4>
              ${cityItemsAvailable.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5em;">
                  <span style="cursor: help;" title="${item.description}">${item.name} (${item.price} dirhams)</span>
                  <button onclick="buyItem('${item.id}')" ${state.items.has(item.id) || state.funds < item.price ? 'disabled' : ''} style="font-size: 0.8em; padding: 0.2em 0.4em;">
                    ${state.items.has(item.id) ? 'Owned' : 'Buy'}
                  </button>
                </div>
              `).join('')}
            </div>
          `;
        }
        
        document.getElementById('trade-controls').innerHTML = `
          ${Object.keys(state.prices).map(item => `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8em;">
              <span style="font-weight: bold; min-width: 120px;">${item.charAt(0).toUpperCase() + item.slice(1)} (${state.prices[item]} dirhams)</span>
              <div style="display: flex; gap: 0.3em;">
                <button onclick="buyAllItem('${item}')" ${getTotalCargo() >= getMaxCargo() ? 'disabled' : ''} style="font-size: 0.85em; padding: 0.25em 0.45em;">Buy All</button>
                <button onclick="buyOneItem('${item}')" ${getTotalCargo() >= getMaxCargo() ? 'disabled' : ''} style="font-size: 0.85em; padding: 0.25em 0.45em;">Buy One</button>
                <button onclick="sellOneItem('${item}')" ${state.cargo[item] <= 0 ? 'disabled' : ''} style="font-size: 0.85em; padding: 0.25em 0.45em;">Sell One</button>
                <button onclick="sellAllItem('${item}')" ${state.cargo[item] <= 0 ? 'disabled' : ''} style="font-size: 0.85em; padding: 0.25em 0.45em;">Sell All</button>
              </div>
            </div>
          `).join('')}
          ${itemsHtml}
        `;
      } else {
        document.getElementById('trade-section').style.display = 'none';
      }
      
      const canRestHere = canRest(state.pos.q, state.pos.r);
      const cityOasisCost = state.items.has('camel_shoes') ? '0 supplies' : '1 supply';
      document.getElementById('actions').innerHTML = `
        <div>Click adjacent hexes to move</div>
        <div>Desert tiles cost 1-5 supplies (less for worn paths)</div>
        <div>Cities and oases cost ${cityOasisCost}</div>
        <button onclick="restSupplies()" ${canRestHere && state.funds >= 5 ? '' : 'disabled'}>
          Rest & Resupply (5 dirhams)${canRestHere ? '' : ' - Need city or oasis!'}
        </button>
      `;
      
      updateCitiesChecklist();
      updateItemsList();
    }

    function buyAllItem(item) {
      const maxByFunds = Math.floor(state.funds / state.prices[item]);
      const maxByCargo = getMaxCargo() - getTotalCargo();
      const qty = Math.min(maxByFunds, maxByCargo);
      
      if (qty <= 0) {
        showToast(maxByCargo <= 0 ? 'Cargo full!' : 'Not enough funds!');
        return;
      }
      
      const cost = state.prices[item] * qty;
      state.funds -= cost;
      state.cargo[item] += qty;
      addLog(`Bought ${qty} ${item} for ${cost} dirhams`);
      updateUI();
    }

    function buyOneItem(item) {
      const cost = state.prices[item];
      const currentCargo = getTotalCargo();
      
      if (currentCargo >= getMaxCargo()) {
        showToast('Cargo full!');
        return;
      }
      
      if (state.funds >= cost) {
        state.funds -= cost;
        state.cargo[item] += 1;
        addLog(`Bought 1 ${item} for ${cost} dirhams`);
        updateUI();
      } else {
        showToast('Not enough funds!');
      }
    }

    function sellOneItem(item) {
      if (state.cargo[item] >= 1) {
        const revenue = state.prices[item];
        state.funds += revenue;
        state.cargo[item] -= 1;
        addLog(`Sold 1 ${item} for ${revenue} dirhams`);
        updateUI();
      } else {
        showToast(`No ${item} to sell!`);
      }
    }

    function sellAllItem(item) {
      const qty = state.cargo[item];
      if (qty <= 0) {
        showToast(`No ${item} to sell!`);
        return;
      }
      
      const revenue = state.prices[item] * qty;
      state.funds += revenue;
      state.cargo[item] = 0;
      addLog(`Sold ${qty} ${item} for ${revenue} dirhams`);
      updateUI();
    }

    function restSupplies() {
      if (!canRest(state.pos.q, state.pos.r)) {
        showToast('You can only rest in cities or oases!');
        return;
      }
      
      if (state.funds >= 5) {
        state.funds -= 5;
        state.supplies.food = Math.min(getMaxFood(), state.supplies.food + 20);
        
        const oasis = getOasis(state.pos.q, state.pos.r);
        if (oasis) {
          addLog(`Rested at ${oasis.name} oasis`);
          state.supplies.food = Math.min(getMaxFood(), state.supplies.food + 10);
        } else {
          addLog('Rested and resupplied in the city');
        }

        if (Math.random() < 0.15) {
          const events = [
            'Sandstorm! Lost 5 food.',
            'Found hidden cache! Gained 10 food.',
            'Bandits demanded tribute!',
            'Met friendly merchants.',
            'Discovered shortcut to nearby city.',
            'Heard rumors of price changes.'
          ];
          const event = events[Math.floor(Math.random() * events.length)];
          addLog(event);
          if (event.includes('Lost 5 food')) state.supplies.food = Math.max(0, state.supplies.food - 5);
          if (event.includes('Gained 10 food')) {
            state.supplies.food = Math.min(getMaxFood(), state.supplies.food + 10);
          }
        }
        
        updateUI();
        drawMap();
      }
    }

    function moveToHex(targetQ, targetR) {
      const target = { q: targetQ, r: targetR };
      
      if (!coords.some(c => c.q === targetQ && c.r === targetR)) {
        console.log('Target hex not in grid:', targetQ, targetR);
        return;
      }
      
      const distance = hexDistance(state.pos, target);
      console.log('Distance to target:', distance, 'from', state.pos, 'to', target);
      
      if (distance !== 1) {
        showToast('Can only move to adjacent hexes!');
        return;
      }

      // Check for water tiles
      const water = getWater(targetQ, targetR);
      if (water && !state.items.has('boat')) {
        showToast('Cannot cross water without a boat!');
        return;
      }

      const movementCost = getMovementCost(targetQ, targetR);
      
      if (state.supplies.food < movementCost.food) {
        showToast(`Need ${movementCost.food} food to travel there!`);
        return;
      }
      
      updatePathWear();
      const currentWear = getPathWear(targetQ, targetR);
      setPathWear(targetQ, targetR, currentWear + 20);

      state.supplies.food -= movementCost.food;
      state.pos = target;
      lastMove = target;

      // Decrement camel blessing counter
      if (state.guildEffects.camelBlessing > 0) {
        state.guildEffects.camelBlessing--;
      }

      // Increment time (hours) and check for new day
      state.time++;
      if (state.time % HOURS_PER_DAY === 0) {
        onNewDay();
      }

      const city = getCity(targetQ, targetR);
      const oasis = getOasis(targetQ, targetR);
      if (city) {
        updateCurrentPrices();
        if (!state.visitedCities.has(city.name)) {
          state.visitedCities.add(city.name);
          addLog(`First visit to ${city.name}! 🎉`);
          if (state.visitedCities.size === cities.length) {
            const days = Math.floor(state.time / HOURS_PER_DAY);
            addLog(`🏆 VICTORY! You visited all ${cities.length} cities in ${days} days with ${state.funds} dirhams!`);
            showToast('🏆 You visited all cities!');
          }
        } else {
          addLog(`Arrived at ${city.name}`);
        }
        // Show guild panel if city has a guild
        if (state.cityGuilds[city.name]) {
          showGuildPanel();
        }
      } else if (oasis) {
        addLog(`Reached ${oasis.name} oasis`);
        closeGuildPanel();
      } else {
        if (movementCost.food > 1) {
          addLog(`Difficult desert crossing (${movementCost.food} supplies used)`);
        } else {
          addLog('Following well-worn path');
        }
        closeGuildPanel();
      }

      updateUI();
      drawMap();
    }

    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const hex = pixelToHex(x, y);
      console.log('Clicked hex:', hex, 'Current pos:', state.pos);
      
      const { x: pixelX, y: pixelY } = hexToPixel(hex.q, hex.r);
      ctx.beginPath();
      ctx.arc(pixelX, pixelY, 5 * state.zoom, 0, 2 * Math.PI);
      ctx.fillStyle = 'red';
      ctx.fill();
      setTimeout(() => drawMap(), 200);
      
      moveToHex(hex.q, hex.r);
    });

    function toggleZoom() {
      state.zoom = state.zoom === 1 ? 2 : 1;
      document.getElementById('zoom-toggle').textContent = `${state.zoom}x`;
      
      // Update canvas size
      if (state.zoom === 2) {
        canvas.width = 1800;
        canvas.height = 1800;
      } else {
        canvas.width = 900;
        canvas.height = 900;
      }
      
      // Update sidebar text size
      const sidebar = document.getElementById('sidebar');
      if (state.zoom === 2) {
        sidebar.classList.add('zoomed');
      } else {
        sidebar.classList.remove('zoomed');
      }
      
      drawMap();
    }

    // Initialize
    function initializeGame() {
      // Generate random items for each city
      state.cityItems = getRandomCityItems();

      // Assign guilds to cities
      assignGuildsToCity();

      // Set initial canvas size and UI based on starting zoom
      if (state.zoom === 2) {
        canvas.width = 1800;
        canvas.height = 1800;
        document.getElementById('sidebar').classList.add('zoomed');
        document.getElementById('zoom-toggle').textContent = '2x';
      } else {
        canvas.width = 900;
        canvas.height = 900;
        document.getElementById('zoom-toggle').textContent = '1x';
      }
      
      generateAllCityPrices();
      updateCurrentPrices();
      updateUI();
      drawMap();
      addLog('Journey begins in Chang\'an!');
    }

    initializeGame();
  </script>
</body>
