<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silk Road Caravan 3D</title>
  <style>
    body { font-family: sans-serif; background: #faf0e6; margin: 0; display: flex; height: 100vh; }
    #map { flex: 1; background: #fff8f0; position: relative; overflow: hidden; }
    #map canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #zoom-toggle { position: absolute; top: 10px; right: 10px; background: rgba(245, 224, 195, 0.9); border: 1px solid #c69c6d; border-radius: 4px; padding: 0.3em 0.6em; cursor: pointer; font-size: 0.8em; z-index: 5; }
    #zoom-toggle:hover { background: rgba(232, 209, 179, 0.9); }
    #webgl-fallback { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(245, 235, 220, 0.97); border: 1px solid #c69c6d; border-radius: 8px; padding: 1.5em 2em; max-width: 30em; text-align: center; color: #8b4513; z-index: 15; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    #sidebar { width: 440px; background: #f5f0eb; padding: 1em; box-shadow: -2px 0 5px rgba(0,0,0,0.1); overflow-y: auto; position: relative; font-size: 1em; transition: width 0.3s ease; }
    #sidebar.zoomed { font-size: 1.1em; width: 500px; }
    #sidebar.zoomed button { font-size: 1.1em; padding: 0.33em 0.66em; }
    #sidebar.zoomed input[type="number"] { font-size: 1.1em; }
    h1 { text-align: center; margin: 0 0 1em; color: #8b4513; }
    .stats div, .prices div { margin: 0.5em 0; }
    .trade-row { display: flex; justify-content: space-between; margin: 0.5em 0; }
    .actions div { margin-top: 1em; color: #555; font-size: 0.9em; }
    button { padding: 0.3em 0.6em; border-radius: 4px; border: 1px solid #c69c6d; background: #f5e0c3; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #e8d1b3; }
    button:disabled { background: #ddd; color: #999; cursor: not-allowed; }
    #log { height: 120px; overflow-y: auto; border-top: 1px solid #d3bfa6; padding-top: 0.5em; margin-top: 1em; font-size: 0.9em; background: #fff; border-radius: 4px; padding: 0.5em; }
    #toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 0.5em 1em; background: rgba(0,0,0,0.7); color: #fff; border-radius: 4px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10; }
    .section { margin-bottom: 1em; padding: 0.5em; background: rgba(255,255,255,0.3); border-radius: 4px; }
    .section h3 { margin: 0 0 0.5em; color: #8b4513; }
    input[type="number"] { width: 50px; padding: 0.2em; border: 1px solid #c69c6d; border-radius: 3px; }
    /* Guild Panel */
    #guild-panel { display: none; position: absolute; bottom: 1em; left: 50%; transform: translateX(-50%); background: rgba(245, 235, 220, 0.95); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 20; padding: 0.75em 1em; box-sizing: border-box; max-width: calc(100% - 2em); }
    #guild-panel.visible { display: block; }
    .guild-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4em; }
    .guild-header h2 { margin: 0; color: #8b4513; font-size: 1.1em; }
    .guild-close { background: none; color: #555; border: none; padding: 0.2em 0.5em; cursor: pointer; font-size: 1.1em; }
    .guild-close:hover { color: #333; }
    #guild-standing { margin-bottom: 0.5em; font-style: italic; color: #666; font-size: 0.9em; }
    #guild-services { display: flex; flex-wrap: wrap; gap: 0.4em; }
    .guild-service { background: #fff; border: 1px solid #c69c6d; border-radius: 4px; padding: 0.3em 0.7em; cursor: pointer; }
    .guild-service:hover:not(.locked):not(.used) { background: #e8d1b3; }
    .guild-service.locked { opacity: 0.5; cursor: not-allowed; }
    .guild-service.used { opacity: 0.6; background: #d0d0d0; cursor: not-allowed; }
    .guild-service .service-name { font-weight: bold; font-size: 0.9em; }
    .guild-service .service-price { color: #228b22; font-size: 0.85em; }
    .guild-service .service-desc { font-size: 0.75em; color: #666; }
    #guild-donate { margin-top: 0.5em; padding-top: 0.4em; border-top: 1px solid #c69c6d; font-size: 0.9em; }
  </style>
</head>
<body>
  <div id="map">
    <button id="zoom-toggle" onclick="toggleZoom()">1x</button>
    <div id="webgl-fallback">
      <h3>3D view unavailable</h3>
      <p id="webgl-fallback-reason">This 3D version needs WebGL &mdash; your browser or GPU driver did not provide a WebGL context.</p>
      <p>The 2D version is <b>silk_road_caravan.html</b>.</p>
    </div>
    <div id="guild-panel">
      <div class="guild-header">
        <h2 id="guild-name"></h2>
        <button class="guild-close" onclick="closeGuildPanel()">✕ Close</button>
      </div>
      <div id="guild-standing"></div>
      <div id="guild-services"></div>
      <div id="guild-donate"></div>
    </div>
  </div>
  <div id="sidebar">
    <div id="toast"></div>
    <h1>🐪 Silk Road Caravan</h1>
    <div class="section">
      <h3>📊 Status</h3>
      <div class="stats" id="stats"></div>
    </div>
    <div class="section" id="trade-section" style="display: none;">
      <h3>🏪 Trading Post</h3>
      <div id="trade-controls"></div>
    </div>
    <div class="section">
      <h3>🎯 Actions</h3>
      <div class="actions" id="actions"></div>
    </div>
    <div class="section">
      <h3>📜 Journey Log</h3>
      <div id="log"></div>
    </div>
    <div class="section">
      <h3>🎒 Items</h3>
      <div id="items-list"></div>
    </div>
    <div class="section">
      <h3>🗺️ Cities Visited</h3>
      <div id="cities-checklist"></div>
    </div>
  </div>

    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js" } }
  </script>
  <script>
    // Boot watchdog: the game module below depends on a CDN import of three.js.
    // If that import fails (offline, blocked CDN, captive portal) the module
    // never evaluates and the page would otherwise die silently. Show the
    // fallback card unless the module signals that it booted.
    (function () {
      function showBootFailure() {
        if (window.__game3dBooted) return;
        document.getElementById('webgl-fallback-reason').textContent =
          'The 3D engine (three.js) could not be loaded from the network — ' +
          'you may be offline or the CDN is blocked, so the game cannot start.';
        document.getElementById('webgl-fallback').style.display = 'block';
      }
      window.__bootFallbackTimer = setTimeout(showBootFailure, 3000);
      // A failed module/import fetch fires an error event at the script element;
      // catch it in the capture phase for an immediate message.
      window.addEventListener('error', function () {
        if (!window.__game3dBooted) showBootFailure();
      }, true);
    })();
  </script>
  <script type="module">
    import * as THREE from 'three';

    // Cancel the boot watchdog: reaching this line means the CDN import
    // succeeded and the game module is evaluating.
    window.__game3dBooted = true;
    clearTimeout(window.__bootFallbackTimer);
    document.getElementById('webgl-fallback').style.display = '';

    // ================================================================
    // §B  GAME MODEL — ported verbatim from silk_road_caravan.html.
    //     Only the rendering layer (drawMap, hexToPixel/pixelToHex,
    //     canvas click handler, canvas sizing) is replaced.
    // ================================================================

    let toastTimeout;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = 1;
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { t.style.opacity = 0; }, 1500);
    }

    function addLog(msg) {
      const log = document.getElementById('log');
      const div = document.createElement('div');
      div.textContent = msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    const GRID_RADIUS = 6;
    const HOURS_PER_DAY = 24;
    const size = 40;
    const widthHex = size * Math.sqrt(3);
    const heightHex = size * 2;
    const vert = heightHex * 3/4;
    const coords = [];
    for (let q = -GRID_RADIUS; q <= GRID_RADIUS; q++) {
      for (let r = -GRID_RADIUS; r <= GRID_RADIUS; r++) {
        if (Math.abs(q + r) <= GRID_RADIUS) coords.push({ q, r });
      }
    }

    function hexDistance(a, b) {
      return (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs((a.q + a.r) - (b.q + b.r))) / 2;
    }
    function axialRound(q, r) {
      const s = -q - r;
      let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
      const qdiff = Math.abs(rq - q), rdiff = Math.abs(rr - r), sdiff = Math.abs(rs - s);
      if (qdiff > rdiff && qdiff > sdiff) rq = -rr - rs;
      else if (rdiff > sdiff) rr = -rq - rs;
      return { q: rq, r: rr };
    }

    function getViewDistance() {
      return state.items.has('map_scrolls') ? 3 : 2;
    }
    function getNeighbors(pos) {
      return coords.filter(c => hexDistance(c, pos) === 1);
    }

    const cities = [
      { q: 0, r: 0, name: "Chang'an", emoji: "🏛️" },
      { q: 3, r: 0, name: 'Samarkand', emoji: "🕌" },
      { q: 6, r: -6, name: 'Antioch', emoji: "⛪" },
      { q: -3, r: 4, name: 'Kashgar', emoji: "🏰" },
      { q: -5, r: -1, name: 'Delhi', emoji: "🏘️" },
      { q: 2, r: 4, name: 'Tashkent', emoji: "🏙️" },
      { q: -2, r: -4, name: 'Bukhara', emoji: "🕌" },
      { q: 5, r: 1, name: 'Baghdad', emoji: "🕌" },
      { q: -4, r: -2, name: 'Merv', emoji: "🏛️" }
    ];

    const oases = [
      { q: 3, r: 2, name: "Desert Oasis", emoji: "🌴" },
      { q: -2, r: 3, name: "Palm Springs", emoji: "🌴" },
      { q: 2, r: -3, name: "Mirage Wells", emoji: "🌴" },
      { q: -3, r: -3, name: "Caravan Rest", emoji: "🌴" },
      { q: 4, r: -5, name: "Golden Sands", emoji: "🌴" },
      { q: -1, r: 5, name: "Emerald Pool", emoji: "🌴" }
    ];

    const waterTiles = [
      { q: 6, r: -5 },
      { q: 6, r: -4 },
      { q: 6, r: -3 },
      { q: 5, r: -4 },
      { q: 1, r: 1 },
      { q: 1, r: 2 },
      { q: 2, r: 1 },
      { q: -1, r: -2 },
      { q: 0, r: -2 },
      // Near Samarkand
      { q: 4, r: -3 },
      { q: 3, r: -2 },
      { q: 3, r: -1 },
      { q: 2, r: 0 },
      // Near Baghdad (Tigris)
      { q: 5, r: 0 },
      { q: 4, r: 1 },
      { q: 5, r: -1 },
      { q: 3, r: 1 }
    ];

    function getCity(q, r) {
      return cities.find(city => city.q === q && city.r === r);
    }

    function getWater(q, r) {
      return waterTiles.find(w => w.q === q && w.r === r);
    }

    const gameItems = [
      { id: 'compass', name: 'Compass', price: 30, description: 'Reduces movement cost by 1 (minimum 1) for all desert tiles' },
      { id: 'food_preserves', name: 'Food Preserves', price: 24, description: 'Increases maximum food capacity to 35' },
      { id: 'silk_bags', name: 'Silk Bags', price: 40, description: 'Increases cargo capacity to 30 items' },
      { id: 'map_scrolls', name: 'Map Scrolls', price: 36, description: 'Increases view distance to 3 hexes' },
      { id: 'camel_shoes', name: 'Camel Shoes', price: 20, description: 'Movement to cities and oases costs no supplies' },
      { id: 'boat', name: 'Boat', price: 50, description: 'Allows crossing water tiles (rivers, lakes, seas)' }
    ];

    const guildTypes = {
      caravan: {
        name: 'Caravan Guild',
        emoji: '🐪',
        services: [
          { id: 'route_info', name: 'Route Information', desc: 'Reveal path wear on visible tiles', price: 10, repGain: 2, minRep: 0 },
          { id: 'camel_blessing', name: 'Camel Blessing', desc: 'Next 20 moves cost 1 less food', price: 25, repGain: 5, minRep: 20 }
        ]
      },
      explorers: {
        name: 'Explorers Guild',
        emoji: '🧭',
        services: [
          { id: 'reveal_terrain', name: 'Reveal Terrain', desc: 'Show hexes within 5 tiles of this city', price: 15, repGain: 3, minRep: 0, oneTime: true },
          { id: 'explorer_discount', name: 'Explorer Discount', desc: '50% off compass, map scrolls, boat everywhere', price: 30, repGain: 5, minRep: 20, oneTime: true },
          { id: 'oasis_map', name: 'Oasis Map', desc: 'Mark all oases on your map', price: 40, repGain: 8, minRep: 50, oneTime: true }
        ]
      },
      merchants: {
        name: 'Merchants Guild',
        emoji: '💰',
        services: [
          { id: 'price_report', name: 'Price Report', desc: 'View prices at 3 random cities', price: 8, repGain: 2, minRep: 0 },
          { id: 'market_manipulation', name: 'Market Manipulation', desc: 'Increase price of a good by 2 here', price: 20, repGain: 4, minRep: 20 }
        ]
      },
      smugglers: {
        name: 'Smugglers Guild',
        emoji: '🗡️',
        services: [
          { id: 'contraband_tip', name: 'Contraband Tip', desc: 'Reveals highest price for a random good', price: 12, repGain: 3, minRep: 0 },
          { id: 'bribe_guards', name: 'Bribe Guards', desc: '+20 rep with another guild (7-day cooldown)', price: 50, repGain: 0, minRep: 30 }
        ]
      }
    };

    function assignGuildsToCity() {
      const guildList = ['caravan', 'explorers', 'merchants', 'smugglers'];
      const shuffledCities = [...cities].sort(() => Math.random() - 0.5);
      state.cityGuilds = {};
      guildList.forEach((guild, i) => {
        if (shuffledCities[i]) {
          state.cityGuilds[shuffledCities[i].name] = guild;
        }
      });
      // Randomize donation rates (1-10 rep per 20 dirhams)
      guildList.forEach(g => {
        state.guildDonationRates[g] = Math.floor(Math.random() * 10) + 1;
      });
    }

    function getReputationLevel(rep) {
      if (rep <= -50) return { name: 'Shunned', canUse: false, message: 'The guild members flee at your approach!' };
      if (rep < 0) return { name: 'Suspect', canUse: false, message: 'The guild refuses to deal with you.' };
      if (rep < 20) return { name: 'Stranger', canUse: true, discount: 0 };
      if (rep < 50) return { name: 'Known', canUse: true, discount: 0 };
      if (rep < 80) return { name: 'Trusted', canUse: true, discount: 0.1 };
      return { name: 'Honored', canUse: true, discount: 0.2 };
    }

    function getGuildForCurrentCity() {
      const city = getCity(state.pos.q, state.pos.r);
      if (!city) return null;
      const guildType = state.cityGuilds[city.name];
      if (!guildType) return null;
      return { type: guildType, city: city.name, ...guildTypes[guildType] };
    }

    function showGuildPanel() {
      const guild = getGuildForCurrentCity();
      if (!guild) return;

      const rep = state.guildReputation[guild.type];
      const level = getReputationLevel(rep);

      document.getElementById('guild-name').textContent = `${guild.emoji} ${guild.name}`;

      if (!level.canUse) {
        document.getElementById('guild-standing').textContent = `Standing: ${level.name} (${rep}) - ${level.message}`;
        document.getElementById('guild-services').innerHTML = '';
        document.getElementById('guild-donate').innerHTML = '';
      } else {
        const discountText = level.discount > 0 ? ` (${Math.round(level.discount * 100)}% discount!)` : '';
        document.getElementById('guild-standing').textContent = `Standing: ${level.name} (${rep})${discountText}`;

        let servicesHtml = '';
        guild.services.forEach(service => {
          const isLocked = rep < service.minRep;
          const isUsed = service.oneTime && state.usedServices.has(service.id);
          const currentDay = Math.floor(state.time / HOURS_PER_DAY);
          const isOnCooldown = service.id === 'bribe_guards' && (currentDay - state.guildEffects.lastBribeDay < 7);
          const cooldownDays = isOnCooldown ? 7 - (currentDay - state.guildEffects.lastBribeDay) : 0;
          const price = Math.round(service.price * (1 - level.discount));
          const canAfford = state.funds >= price;

          let classes = 'guild-service';
          if (isLocked) classes += ' locked';
          if (isUsed || isOnCooldown) classes += ' used';

          let statusText = '';
          if (isLocked) statusText = ` [Need ${service.minRep} rep]`;
          else if (isUsed) statusText = ' [Already used]';
          else if (isOnCooldown) statusText = ` [${cooldownDays} day${cooldownDays > 1 ? 's' : ''} cooldown]`;

          const canUse = !isLocked && !isUsed && !isOnCooldown && canAfford;
          servicesHtml += `
            <div class="${classes}" onclick="${canUse ? `useGuildService('${service.id}')` : ''}">
              <div class="service-name">${service.name}${statusText}</div>
              <div class="service-price">${price} dirhams</div>
              <div class="service-desc">${service.desc}</div>
            </div>
          `;
        });
        document.getElementById('guild-services').innerHTML = servicesHtml;

        const donateRate = state.guildDonationRates[guild.type];
        document.getElementById('guild-donate').innerHTML = `
          <button onclick="donateToGuild()" ${state.funds < 20 ? 'disabled' : ''}>
            Donate 20 dirhams (+${donateRate} reputation)
          </button>
        `;
      }

      document.getElementById('guild-panel').classList.add('visible');
    }

    function closeGuildPanel() {
      document.getElementById('guild-panel').classList.remove('visible');
    }

    function donateToGuild() {
      const guild = getGuildForCurrentCity();
      if (!guild || state.funds < 20) return;

      state.funds -= 20;
      const gain = state.guildDonationRates[guild.type];
      state.guildReputation[guild.type] = Math.min(100, state.guildReputation[guild.type] + gain);
      addLog(`Donated 20 dirhams to ${guild.name} (+${gain} reputation)`);
      showGuildPanel();
      updateUI();
    }

    function useGuildService(serviceId) {
      const guild = getGuildForCurrentCity();
      if (!guild) return;

      const service = guild.services.find(s => s.id === serviceId);
      if (!service) return;

      const rep = state.guildReputation[guild.type];
      const level = getReputationLevel(rep);
      if (!level.canUse || rep < service.minRep) return;
      if (service.oneTime && state.usedServices.has(serviceId)) return;

      const price = Math.round(service.price * (1 - level.discount));
      if (state.funds < price) {
        showToast('Not enough funds!');
        return;
      }

      state.funds -= price;
      state.guildReputation[guild.type] = Math.min(100, rep + service.repGain);
      if (service.oneTime) state.usedServices.add(serviceId);

      // Execute service effect
      switch (serviceId) {
        case 'route_info': useRouteInfo(); break;
        case 'camel_blessing': useCamelBlessing(); break;
        case 'reveal_terrain': useRevealTerrain(guild.city); break;
        case 'explorer_discount': useExplorerDiscount(); break;
        case 'oasis_map': useOasisMap(); break;
        case 'price_report': usePriceReport(); break;
        case 'market_manipulation': useMarketManipulation(); break;
        case 'contraband_tip': useContrabandTip(); break;
        case 'bribe_guards': useBribeGuards(); break;
      }

      addLog(`Used ${service.name} from ${guild.name}`);
      showGuildPanel();
      updateUI();
      drawMap();
    }

    // Service implementations
    function useRouteInfo() {
      const viewDist = getViewDistance();
      let info = 'Path wear: ';
      coords.forEach(c => {
        if (hexDistance(c, state.pos) <= viewDist) {
          const wear = getPathWear(c.q, c.r);
          if (wear > 0) {
            info += `(${c.q},${c.r}):${wear} `;
          }
        }
      });
      addLog(info || 'No worn paths nearby.');
      showToast('Path wear revealed in log!');
    }

    function useCamelBlessing() {
      state.guildEffects.camelBlessing = 20;
      showToast('Camel Blessing active for 20 moves!');
    }

    function useRevealTerrain(cityName) {
      if (!state.guildEffects.revealedCities.includes(cityName)) {
        state.guildEffects.revealedCities.push(cityName);
      }
      showToast(`Terrain around ${cityName} revealed!`);
    }

    function useExplorerDiscount() {
      state.guildEffects.explorerDiscount = true;
      showToast('50% off explorer items permanently!');
    }

    function useOasisMap() {
      state.guildEffects.oasisMapRevealed = true;
      showToast('All oases marked on map!');
    }

    function usePriceReport() {
      const currentCity = getCity(state.pos.q, state.pos.r);
      const otherCities = cities.filter(c => c.name !== currentCity?.name);
      const selected = otherCities.sort(() => Math.random() - 0.5).slice(0, 3);

      selected.forEach(city => {
        const prices = state.cityPrices[city.name];
        const dist = hexDistance(city, state.pos);
        addLog(`${city.name} (${dist} away): Silk ${prices.silk}, Spices ${prices.spices}, Pottery ${prices.pottery}`);
      });
      showToast('Price report in log!');
    }

    function useMarketManipulation() {
      const goods = ['silk', 'spices', 'pottery'];
      const good = goods[Math.floor(Math.random() * goods.length)];
      const city = getCity(state.pos.q, state.pos.r);
      if (city && state.cityPrices[city.name]) {
        state.cityPrices[city.name][good] += 2;
        state.prices[good] += 2;
        addLog(`${good.charAt(0).toUpperCase() + good.slice(1)} price increased by 2 in ${city.name}!`);
        showToast(`${good} price +2!`);
      }
    }

    function useContrabandTip() {
      const goods = ['silk', 'spices', 'pottery'];
      const good = goods[Math.floor(Math.random() * goods.length)];
      let bestCity = null;
      let bestPrice = 0;

      cities.forEach(city => {
        const price = state.cityPrices[city.name]?.[good] || 0;
        if (price > bestPrice) {
          bestPrice = price;
          bestCity = city;
        }
      });

      if (bestCity) {
        addLog(`Tip: ${good.charAt(0).toUpperCase() + good.slice(1)} sells for ${bestPrice} in ${bestCity.name}!`);
        showToast(`${good} best at ${bestCity.name}!`);
      }
    }

    function useBribeGuards() {
      const currentDay = Math.floor(state.time / HOURS_PER_DAY);
      if (currentDay - state.guildEffects.lastBribeDay < 7) {
        showToast('Bribe cooldown not ready!');
        return;
      }

      const guild = getGuildForCurrentCity();
      const otherGuilds = Object.keys(guildTypes).filter(g => g !== guild?.type);
      const targetGuild = otherGuilds[Math.floor(Math.random() * otherGuilds.length)];

      state.guildReputation[targetGuild] = Math.min(100, state.guildReputation[targetGuild] + 20);
      state.guildEffects.lastBribeDay = currentDay;
      addLog(`Bribed guards: +20 reputation with ${guildTypes[targetGuild].name}!`);
      showToast(`+20 rep with ${guildTypes[targetGuild].name}!`);
    }

    function getRandomCityItems() {
      const cityItems = {};
      cities.forEach(city => {
        const numItems = Math.random() < 0.7 ? (Math.random() < 0.5 ? 0 : 1) : Math.random() < 0.6 ? 2 : 3;
        if (numItems > 0) {
          const shuffled = [...gameItems].sort(() => Math.random() - 0.5);
          cityItems[city.name] = shuffled.slice(0, numItems);
        } else {
          cityItems[city.name] = [];
        }
      });
      return cityItems;
    }

    function getOasis(q, r) {
      return oases.find(oasis => oasis.q === q && oasis.r === r);
    }

    function canRest(q, r) {
      return getCity(q, r) || getOasis(q, r);
    }

    let state = {
      funds: 20,
      supplies: { food: 25 },
      reputation: 0,
      cargo: { silk: 0, spices: 0, pottery: 0 },
      pos: { q: 0, r: 0 },
      prices: {},
      cityPrices: {},
      pathWear: {},
      visitedCities: new Set(['Chang\'an']),
      zoom: window.innerWidth > 1100 ? 2 : 1,
      items: new Set(),
      cityItems: {},
      time: 0,
      // Guild system
      guildReputation: { caravan: 10, explorers: 10, merchants: 10, smugglers: 10 },
      guildDonationRates: {},
      cityGuilds: {},
      usedServices: new Set(),
      guildEffects: {
        camelBlessing: 0,
        explorerDiscount: false,
        revealedCities: [],
        oasisMapRevealed: false,
        lastBribeDay: -999
      }
    };
    let lastMove = null;

    function getPathWear(q, r) {
      const key = `${q},${r}`;
      return state.pathWear[key] || 0;
    }

    function setPathWear(q, r, value) {
      const key = `${q},${r}`;
      state.pathWear[key] = Math.max(0, Math.min(200, value));
    }

    function updatePathWear() {
      Object.keys(state.pathWear).forEach(key => {
        state.pathWear[key] = Math.max(0, state.pathWear[key] - 1);
        if (state.pathWear[key] === 0) {
          delete state.pathWear[key];
        }
      });
    }

    function getMovementCost(q, r) {
      const city = getCity(q, r);
      const oasis = getOasis(q, r);
      const water = getWater(q, r);

      if (city || oasis) return { food: 1 };
      if (water) return { food: 1 };  // Sailing is easy

      const pathWear = getPathWear(q, r);
      // Cost starts at 5 for untraveled, goes down to 1 for well-traveled (200 wear)
      // Evenly distributed: 0-49=5, 50-99=4, 100-149=3, 150-199=2, 200=1
      let cost = Math.max(1, 5 - Math.floor(pathWear / 40));

      // Apply camel blessing discount
      if (state.guildEffects.camelBlessing > 0) {
        cost = Math.max(1, cost - 1);
      }

      return { food: cost };
    }

    function generateAllCityPrices() {
      cities.forEach(city => {
        const baseSilk = 5 + (city.q + city.r) * 0.5;
        const baseSpices = 3 + (city.q - city.r) * 0.3;
        const basePottery = 4 + Math.abs(city.q) * 0.4;
        state.cityPrices[city.name] = {
          silk: Math.max(1, Math.round(baseSilk + (Math.random() * 2 - 1))),
          spices: Math.max(1, Math.round(baseSpices + (Math.random() * 2 - 1))),
          pottery: Math.max(1, Math.round(basePottery + (Math.random() * 2 - 1)))
        };
      });
    }

    function updateCurrentPrices() {
      const city = getCity(state.pos.q, state.pos.r);
      if (!city) {
        state.prices = {};
      } else {
        state.prices = state.cityPrices[city.name];
      }
    }

    function marketFluctuation() {
      // Affect 1/3 of all cities (rounded up)
      const numCitiesToAffect = Math.ceil(cities.length / 3);
      const shuffledCities = [...cities].sort(() => Math.random() - 0.5);
      const affectedCities = shuffledCities.slice(0, numCitiesToAffect);

      let currentCityAffected = false;
      const currentCity = getCity(state.pos.q, state.pos.r);

      affectedCities.forEach(city => {
        const prices = state.cityPrices[city.name];
        Object.keys(prices).forEach(item => {
          if (Math.random() < 0.9) {
            const delta = Math.random() < 0.5 ? 1 : -1;
            prices[item] = Math.max(1, prices[item] + delta);
          } else {
            const delta = Math.floor((Math.random() * 5 + 1) * (Math.random() < 0.5 ? 1 : -1));
            prices[item] = Math.max(1, prices[item] + delta);
          }
        });

        if (currentCity && currentCity.name === city.name) {
          currentCityAffected = true;
        }
      });

      // Update visible prices if in a city
      updateCurrentPrices();

      // Show notification
      const cityNames = affectedCities.map(city => city.name).join(', ');
      if (currentCityAffected) {
        showToast(`Market prices fluctuated in: ${cityNames}`);
      } else {
        showToast(`Markets changed in: ${cityNames}`);
      }
    }

    function onNewDay() {
      const day = state.time / HOURS_PER_DAY;
      addLog(`--- Day ${day} begins ---`);

      // 80% chance of market fluctuation
      if (Math.random() < 0.8) {
        marketFluctuation();
      }

      // Guild reputation decay toward 10
      Object.keys(state.guildReputation).forEach(guild => {
        const rep = state.guildReputation[guild];
        if (rep > 10) state.guildReputation[guild]--;
        else if (rep < 10) state.guildReputation[guild]++;
      });
    }

    // (3D) drawMap is a name-compatible dirty-flag shim: every original call
    // site is untouched; the actual scene sync runs at most once per rAF frame.
    let viewDirty = true;
    function drawMap() { viewDirty = true; }

    function getTotalCargo() {
      return state.cargo.silk + state.cargo.spices + state.cargo.pottery;
    }

    function getMaxCargo() {
      return state.items.has('silk_bags') ? 30 : 20;
    }

    function getMaxFood() {
      return state.items.has('food_preserves') ? 35 : 25;
    }

    function updateItemsList() {

    function buyItem(itemId) {
      const item = gameItems.find(i => i.id === itemId);
      if (!item) return;

      if (state.items.has(itemId)) {
        showToast('You already own this item!');
        return;

      let price = item.price;
      const explorerItems = ['compass', 'map_scrolls', 'boat'];
      if (state.guildEffects.explorerDiscount && explorerItems.includes(itemId)) {
        price = Math.round(price * 0.5);
      }

      if (state.funds >= price) {
        state.funds -= price;
        state.items.add(itemId);
        addLog(`Purchased ${item.name} for ${price} dirhams`);
        updateUI();

    function buyAllItem(item) {
      const maxByFunds = Math.floor(state.funds / state.prices[item]);
      const maxByCargo = getMaxCargo() - getTotalCargo();
      const qty = Math.min(maxByFunds, maxByCargo);

      if (qty <= 0) {
        showToast(maxByCargo <= 0 ? 'Cargo full!' : 'Not enough funds!');
        return;
      }

      const cost = state.prices[item] * qty;
      state.funds -= cost;
      state.cargo[item] += qty;
      addLog(`Bought ${qty} ${item} for ${cost} dirhams`);
      updateUI();
    }

    function buyOneItem(item) {
      const cost = state.prices[item];
      const currentCargo = getTotalCargo();

      if (currentCargo >= getMaxCargo()) {
        showToast('Cargo full!');
        return;
      }

      if (state.funds >= cost) {
        state.funds -= cost;
        state.cargo[item] += 1;
        addLog(`Bought 1 ${item} for ${cost} dirhams`);
        updateUI();
      } else {
        showToast('Not enough funds!');
      }
    }

    function sellOneItem(item) {
      if (state.cargo[item] >= 1) {
        const revenue = state.prices[item];
        state.funds += revenue;
        state.cargo[item] -= 1;
        addLog(`Sold 1 ${item} for ${revenue} dirhams`);
        updateUI();
      } else {
        showToast(`No ${item} to sell!`);
      }
    }

    function sellAllItem(item) {
      const qty = state.cargo[item];
      if (qty <= 0) {
        showToast(`No ${item} to sell!`);
        return;
      }

      const revenue = state.prices[item] * qty;
      state.funds += revenue;
      state.cargo[item] = 0;
      addLog(`Sold ${qty} ${item} for ${revenue} dirhams`);
      updateUI();
    }

    function restSupplies() {
      if (!canRest(state.pos.q, state.pos.r)) {
        showToast('You can only rest in cities or oases!');
        return;
      }

      if (state.funds >= 5) {
        state.funds -= 5;
        state.supplies.food = Math.min(getMaxFood(), state.supplies.food + 20);

        const oasis = getOasis(state.pos.q, state.pos.r);
        if (oasis) {
          addLog(`Rested at ${oasis.name} oasis`);
          state.supplies.food = Math.min(getMaxFood(), state.supplies.food + 10);
        } else {
          addLog('Rested and resupplied in the city');

        if (Math.random() < 0.15) {
          const events = [
            'Sandstorm! Lost 5 food.',
            'Found hidden cache! Gained 10 food.',
            'Bandits demanded tribute!',
            'Met friendly merchants.',
            'Discovered shortcut to nearby city.',
            'Heard rumors of price changes.'
          ];
          const event = events[Math.floor(Math.random() * events.length)];
          addLog(event);
          if (event.includes('Lost 5 food')) state.supplies.food = Math.max(0, state.supplies.food - 5);
          if (event.includes('Gained 10 food')) {
            state.supplies.food = Math.min(getMaxFood(), state.supplies.food + 10);
          }
        }

        updateUI();
        drawMap();
      }

    function moveToHex(targetQ, targetR) {
      const target = { q: targetQ, r: targetR };

      if (!coords.some(c => c.q === targetQ && c.r === targetR)) {
        return;
      }

      const distance = hexDistance(state.pos, target);

      if (distance !== 1) {
        showToast('Can only move to adjacent hexes!');
        return;
      }

      // Check for water tiles
      const water = getWater(targetQ, targetR);
      if (water && !state.items.has('boat')) {
        showToast('Cannot cross water without a boat!');
        return;
      }

      const movementCost = getMovementCost(targetQ, targetR);

      if (state.supplies.food < movementCost.food) {
        showToast(`Need ${movementCost.food} food to travel there!`);
        return;
      }

      updatePathWear();
      const currentWear = getPathWear(targetQ, targetR);
      setPathWear(targetQ, targetR, currentWear + 20);

      state.supplies.food -= movementCost.food;
      state.pos = target;
      lastMove = target;

      // Decrement camel blessing counter
      if (state.guildEffects.camelBlessing > 0) {
        state.guildEffects.camelBlessing--;
      }

      // Increment time (hours) and check for new day
      state.time++;
      if (state.time % HOURS_PER_DAY === 0) {
        onNewDay();
      }

      const city = getCity(targetQ, targetR);
      const oasis = getOasis(targetQ, targetR);
      if (city) {
        updateCurrentPrices();
        if (!state.visitedCities.has(city.name)) {
          state.visitedCities.add(city.name);
          addLog(`First visit to ${city.name}! 🎉`);
          if (state.visitedCities.size === cities.length) {
            const days = Math.floor(state.time / HOURS_PER_DAY);
            addLog(`🏆 VICTORY! You visited all ${cities.length} cities in ${days} days with ${state.funds} dirhams!`);
            showToast('🏆 You visited all cities!');
          }
        } else {
          addLog(`Arrived at ${city.name}`);
        }
        // Show guild panel if city has a guild; otherwise close any stale
        // panel left over from an adjacent guild city (Delhi/Merv are 1 apart)
        if (state.cityGuilds[city.name]) {
          showGuildPanel();
        } else {
          closeGuildPanel();
        }
      } else if (oasis) {
        addLog(`Reached ${oasis.name} oasis`);
        closeGuildPanel();
      } else {
        if (movementCost.food > 1) {
          addLog(`Difficult desert crossing (${movementCost.food} supplies used)`);
        } else {
          addLog('Following well-worn path');
        }
        closeGuildPanel();
      }

      updateUI();
      drawMap();
    }

    // ---------------------------------------------------------------
    // Geometry builders
    // ---------------------------------------------------------------
    function buildHexPrismGeometry() {
      // Unit prism: pointy-top hexagon extruded y 0..1, no bottom cap.
      // Group 0 = top cap (material 0, unlit), group 1 = sides (material 1, lit).
      const pos = [], norm = [];
      // Top cap, +Y normal
      for (let i = 0; i < 6; i++) {
        const a = HEX_CORNERS[i], b = HEX_CORNERS[(i + 1) % 6];
        pos.push(0, 1, 0, b.x, 1, b.z, a.x, 1, a.z);
        norm.push(0, 1, 0, 0, 1, 0, 0, 1, 0);
      }
      const topCount = pos.length / 3;
      // Sides, outward flat normals
      for (let i = 0; i < 6; i++) {
        const a = HEX_CORNERS[i], b = HEX_CORNERS[(i + 1) % 6];
        let nx = (a.x + b.x) / 2, nz = (a.z + b.z) / 2;
        const nl = Math.hypot(nx, nz); nx /= nl; nz /= nl;
        // triangles: (b0, a0, a1), (b0, a1, b1)  [outward winding]
        pos.push(b.x, 0, b.z, a.x, 0, a.z, a.x, 1, a.z);
        pos.push(b.x, 0, b.z, a.x, 1, a.z, b.x, 1, b.z);
        for (let k = 0; k < 6; k++) norm.push(nx, 0, nz);
      }
      // Planar UVs from local x/z (~0.5 texture repeats per hex) so the top
      // material can carry a subtle grain detail map. Sides share the same
      // projection (their material has no map, so values are irrelevant).
      const uv = [];
      for (let i = 0; i < pos.length; i += 3) uv.push(pos[i] * 0.25 + 0.5, pos[i + 2] * 0.25 + 0.5);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.addGroup(0, topCount, 0);
      geo.addGroup(topCount, pos.length / 3 - topCount, 1);
      return geo;
    }

    function buildHexAnnulusGeometry(outer, inner) {
      // Flat hexagonal ring in XZ plane, +Y normal, at y=0.
      const pos = [], norm = [];
      for (let i = 0; i < 6; i++) {
        const a = HEX_CORNERS[i], b = HEX_CORNERS[(i + 1) % 6];
        const ao = [a.x * outer, a.z * outer], bo = [b.x * outer, b.z * outer];
        const ai = [a.x * inner, a.z * inner], bi = [b.x * inner, b.z * inner];
        // two triangles per edge segment (winding for +Y)
        pos.push(ai[0], 0, ai[1], bo[0], 0, bo[1], ao[0], 0, ao[1]);
        pos.push(ai[0], 0, ai[1], bi[0], 0, bi[1], bo[0], 0, bo[1]);
        for (let k = 0; k < 6; k++) norm.push(0, 1, 0);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
      return geo;
    }

    function mergeParts(parts) {
      const positions = [], normals = [], colors = [];
      const col = new THREE.Color();
      for (const p of parts) {
        const g = p.geo.index ? p.geo.toNonIndexed() : p.geo;
        g.applyMatrix4(p.matrix);
        const pa = g.attributes.position.array, na = g.attributes.normal.array;
        col.setStyle(p.color);
        for (let i = 0; i < pa.length; i += 3) {
          positions.push(pa[i], pa[i + 1], pa[i + 2]);
          normals.push(na[i], na[i + 1], na[i + 2]);
          colors.push(col.r, col.g, col.b);
        }
        g.dispose();
        if (g !== p.geo) p.geo.dispose();
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      return geo;
    }

    function addPart(parts, geo, color, x, y, z, ry = 0, rz = 0) {
      const m = new THREE.Matrix4().compose(
        new THREE.Vector3(x, y, z),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry, rz)),
        new THREE.Vector3(1, 1, 1));
      parts.push({ geo, matrix: m, color });
    }

    // Settlement decor keyed to the spec emoji; hex center kept clear (plaza).
    const C_WALL = '#d9c6a0', C_WALL2 = '#c9b08a', C_DOME = '#3fa7a0', C_ROOF = '#c96f3b', C_ACCENT = '#8b4513', C_PALM = '#2e8b57', C_TRUNK = '#8a6239';
    function buildSettlementDecorGeo(emoji) {
      const parts = [];
      const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
      const Cyl = (rt, rb, h, seg = 8) => new THREE.CylinderGeometry(rt, rb, h, seg);
      const Cone = (r, h, seg = 8) => new THREE.ConeGeometry(r, h, seg);
      const Dome = (r) => new THREE.SphereGeometry(r, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2);
      const P1 = [0.52, 0.08], P2 = [-0.38, 0.42], P3 = [-0.34, -0.44], P4 = [0.16, 0.55], P5 = [0.05, -0.58];
      if (emoji === '🕌') {
        addPart(parts, B(0.36, 0.2, 0.3), C_WALL, P1[0], 0.1, P1[1], 0.3);
        addPart(parts, Dome(0.13), C_DOME, P1[0], 0.2, P1[1]);
        addPart(parts, Cyl(0.028, 0.034, 0.44), C_WALL2, P2[0], 0.22, P2[1]);
        addPart(parts, Cone(0.05, 0.09), C_DOME, P2[0], 0.48, P2[1]);
        addPart(parts, Cyl(0.028, 0.034, 0.38), C_WALL2, P3[0], 0.19, P3[1]);
        addPart(parts, Cone(0.05, 0.09), C_DOME, P3[0], 0.42, P3[1]);
        addPart(parts, B(0.16, 0.1, 0.14), C_WALL2, P4[0], 0.05, P4[1], -0.4);
      } else if (emoji === '🏛️') {
        addPart(parts, B(0.46, 0.1, 0.32), C_WALL2, P1[0], 0.05, P1[1], 0.2);
        for (let i = 0; i < 4; i++) {
          const t = (i / 3 - 0.5) * 0.34;
          addPart(parts, Cyl(0.025, 0.025, 0.16, 6), C_WALL, P1[0] + t * Math.cos(0.2), 0.18, P1[1] - t * Math.sin(0.2));
        }
        addPart(parts, B(0.52, 0.06, 0.38), C_ROOF, P1[0], 0.29, P1[1], 0.2);
        addPart(parts, B(0.18, 0.12, 0.16), C_WALL, P3[0], 0.06, P3[1], 0.5);
        addPart(parts, B(0.14, 0.1, 0.12), C_WALL2, P2[0], 0.05, P2[1], -0.3);
      } else if (emoji === '⛪') {
        addPart(parts, B(0.3, 0.18, 0.24), C_WALL, P1[0], 0.09, P1[1], 0.25);
        addPart(parts, B(0.34, 0.05, 0.28), C_ROOF, P1[0], 0.21, P1[1], 0.25);
        addPart(parts, B(0.12, 0.3, 0.12), C_WALL2, P2[0], 0.15, P2[1], 0.1);
        addPart(parts, Cone(0.09, 0.2, 4), C_ROOF, P2[0], 0.4, P2[1], 0.1);
        addPart(parts, B(0.14, 0.1, 0.12), C_WALL2, P5[0], 0.05, P5[1], 0.6);
      } else if (emoji === '🏰') {
        for (const [px, pz, h] of [[P1[0], P1[1], 0.36], [P2[0], P2[1], 0.3], [P3[0], P3[1], 0.32]]) {
          addPart(parts, Cyl(0.085, 0.095, h, 8), C_WALL2, px, h / 2, pz);
          addPart(parts, Cyl(0.115, 0.115, 0.05, 8), C_WALL, px, h + 0.025, pz);
          addPart(parts, Cone(0.08, 0.1, 8), C_ROOF, px, h + 0.1, pz);
        }
        addPart(parts, B(0.4, 0.12, 0.06), C_WALL, (P1[0] + P2[0]) / 2, 0.06, (P1[1] + P2[1]) / 2, -0.36);
        addPart(parts, B(0.4, 0.12, 0.06), C_WALL, (P2[0] + P3[0]) / 2, 0.06, (P2[1] + P3[1]) / 2, 1.53);
      } else { // 🏘️ / 🏙️ — clustered houses
        const tall = emoji === '🏙️' ? 1.5 : 1;
        const spots = [P1, P2, P3, P4, P5];
        const dims = [[0.2, 0.18, 0.16], [0.16, 0.24, 0.14], [0.18, 0.14, 0.16], [0.14, 0.2, 0.12], [0.16, 0.16, 0.14]];
        spots.forEach(([px, pz], i) => {
          const [w, h0, d] = dims[i];
          const h = h0 * tall;
          addPart(parts, B(w, h, d), i % 2 ? C_WALL2 : C_WALL, px, h / 2, pz, i * 0.7);
          addPart(parts, B(w * 1.05, 0.03, d * 1.05), C_ROOF, px, h + 0.015, pz, i * 0.7);
        });
      }
      return mergeParts(parts);
    }

    function buildOasisDecorGeo() {
      const parts = [];
      const spots = [[0.42, 0.2, 0.18], [-0.35, 0.38, -0.22], [-0.15, -0.5, 0.3]];
      for (const [px, pz, tilt] of spots) {
        addPart(parts, new THREE.CylinderGeometry(0.028, 0.04, 0.48, 6), C_TRUNK, px, 0.24, pz, 0, tilt);
        const topX = px - Math.sin(tilt) * 0.44, topY = 0.48 * Math.cos(tilt);
        addPart(parts, new THREE.ConeGeometry(0.24, 0.1, 7), C_PALM, topX, topY, pz);
        addPart(parts, new THREE.ConeGeometry(0.15, 0.09, 7), C_PALM, topX, topY + 0.06, pz, 0.4);
      }
      return mergeParts(parts);
    }

    // ---------------------------------------------------------------
    // Label textures (prebaked canvases, statically tilted planes)
    // ---------------------------------------------------------------
    function makeTexture(draw, wpx, hpx) {
      const c = document.createElement('canvas');
      c.width = wpx; c.height = hpx;
      const g = c.getContext('2d');
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      draw(g, wpx, hpx);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
      return tex;
    }
    function makeLabelTexture(emoji, name, color) {
      return makeTexture((g, w, h) => {
        g.font = '104px sans-serif';
        g.fillStyle = color;
        g.fillText(emoji, w / 2, 66);
        g.font = 'bold 58px sans-serif';
        g.fillStyle = color;
        g.fillText(name, w / 2, 186);
      }, 512, 256);
    }
    function makeEmojiTexture(emoji, fontPx, sizePx) {
      return makeTexture((g, w, h) => {
        g.font = `${fontPx}px sans-serif`;
        g.fillText(emoji, w / 2, h / 2 + fontPx * 0.04);
      }, sizePx, sizePx);
    }
    function makeBillboard(tex, wWorld, hWorld, renderOrder, depthTest = true) {
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.05, depthWrite: false, depthTest });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(wWorld, hWorld), mat);
      mesh.rotation.x = -CAM_ELEV;   // face the fixed-azimuth camera
      mesh.renderOrder = renderOrder;
      mesh.raycast = () => {};       // never picked
      return mesh;
    }

    // ---------------------------------------------------------------
    // §E/§F  Renderer, scene, static build
    // ---------------------------------------------------------------
    function initView() {
      mapEl = document.getElementById('map');
      try {
        const probe = document.createElement('canvas');
        if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('no WebGL');
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      } catch (err) {
        document.getElementById('webgl-fallback').style.display = 'block';
        return false;
      }
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      mapEl.appendChild(renderer.domElement);

      renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); ctxLost = true; });
      renderer.domElement.addEventListener('webglcontextrestored', () => { ctxLost = false; viewDirty = true; });

      scene = new THREE.Scene();
      scene.background = BG_DAY.clone();

      camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 1, 200);

      hemiLight = new THREE.HemisphereLight(0xffffff, 0xbfae94, 0.85);
      scene.add(hemiLight);
      sunLight = new THREE.DirectionalLight(0xfff2dc, 1.2);
      sunLight.position.set(30, 20, -12);
      scene.add(sunLight);

      // --- per-hex caches ---
      coords.forEach((c, i) => {
        idxByKey.set(`${c.q},${c.r}`, i);
        hexToWorld(c.q, c.r, _v);
        worldX[i] = _v.x; worldZ[i] = _v.z;
        const city = getCity(c.q, c.r), oasis = getOasis(c.q, c.r), water = getWater(c.q, c.r);
        cellCity[i] = city || null;
        cellOasis[i] = oasis || null;
        cellWater[i] = !!water;
        trueH[i] = city ? H_CITY : oasis ? H_OASIS : water ? H_WATER : H_DESERT;
      });

      // --- tiles: one InstancedMesh, two materials ---
      const prismGeo = buildHexPrismGeometry();
      topMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
      sideMat = new THREE.MeshLambertMaterial({ color: 0xbfbfbf, side: THREE.DoubleSide });
      tilesIM = new THREE.InstancedMesh(prismGeo, [topMat, sideMat], coords.length);
      tilesIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      for (let i = 0; i < coords.length; i++) {
        _m.makeScale(1, trueH[i], 1);
        _m.setPosition(worldX[i], 0, worldZ[i]);
        tilesIM.setMatrixAt(i, _m);
        tilesIM.setColorAt(i, COL_FOG_FILL);
      }
      tilesIM.instanceColor.setUsage(THREE.DynamicDrawUsage);
      tilesIM.frustumCulled = false;   // instance heights change; whole grid always relevant
      scene.add(tilesIM);

      // --- merged outline pass ---
      const nVerts = coords.length * 6 * 2;
      outlinePos = new THREE.Float32BufferAttribute(new Float32Array(nVerts * 3), 3);
      outlineCol = new THREE.Float32BufferAttribute(new Float32Array(nVerts * 3), 3);
      outlinePos.setUsage(THREE.DynamicDrawUsage);
      outlineCol.setUsage(THREE.DynamicDrawUsage);
      const outlineGeo = new THREE.BufferGeometry();
      outlineGeo.setAttribute('position', outlinePos);
      outlineGeo.setAttribute('color', outlineCol);
      lineMat = new THREE.LineBasicMaterial({ vertexColors: true });
      outlines = new THREE.LineSegments(outlineGeo, lineMat);
      outlines.frustumCulled = false;  // positions start zeroed; avoid stale bounding sphere
      outlines.raycast = () => {};
      scene.add(outlines);

      // --- water surfaces (animated, world-space phase) ---
      const waterGeo = new THREE.CircleGeometry(0.94 * S, 6, Math.PI / 6);
      waterGeo.rotateX(-Math.PI / 2);
      // depthWrite:false — the wave-displaced surface must not occlude the flat
      // decals (click dot, hover/wear/gold rings, current annulus) that render
      // after it via renderOrder; matches the 2D painter's order (decals on top).
      const waterMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#7ec8e3'), transparent: true, opacity: 0.9, depthWrite: false });
      waterMat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = uTime;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nuniform float uTime;')
          .replace('#include <begin_vertex>', [
            '#include <begin_vertex>',
            'vec4 wpW = modelMatrix * vec4(position, 1.0);',
            'transformed.y += 0.015 * sin(uTime * 1.7 + wpW.x * 3.1) + 0.010 * sin(uTime * 2.3 + wpW.z * 2.7);'
          ].join('\n'))
          // Slow uv drift for the water texture (compiled in only once a map
          // is assigned; MirroredRepeatWrapping keeps the drift seamless).
          .replace('#include <uv_vertex>', [
            '#include <uv_vertex>',
            '#ifdef USE_MAP',
            'vMapUv += vec2(0.020 * uTime, 0.013 * uTime);',
            '#endif'
          ].join('\n'));
      };
      coords.forEach((c, i) => {
        if (!cellWater[i]) return;
        const mesh = new THREE.Mesh(waterGeo, waterMat);
        mesh.position.set(worldX[i], WATER_Y, worldZ[i]);
        mesh.raycast = () => {};
        scene.add(mesh);
        waterMeshByIdx[i] = mesh;
      });

      // --- labels ---
      const waveTex = makeEmojiTexture('🌊', 92, 128);
      coords.forEach((c, i) => {
        if (cellCity[i]) {
          const city = cellCity[i];
          const label = makeBillboard(makeLabelTexture(city.emoji, city.name, '#8b4513'), 1.9, 0.95, 10);
          label.position.set(worldX[i], trueH[i] + 0.9, worldZ[i]);
          scene.add(label);
          labelByIdx[i] = label;
        } else if (cellOasis[i]) {
          const oasis = cellOasis[i];
          const label = makeBillboard(makeLabelTexture(oasis.emoji, oasis.name, '#228b22'), 1.9, 0.95, 10);
          label.position.set(worldX[i], trueH[i] + 0.85, worldZ[i]);
          scene.add(label);
          labelByIdx[i] = label;
        } else if (cellWater[i]) {
          const label = makeBillboard(waveTex, 0.5, 0.5, 10);
          label.position.set(worldX[i], WATER_Y + 0.35, worldZ[i]);
          scene.add(label);
          labelByIdx[i] = label;
        }
      });

      // --- settlement decor (merged, vertex-colored) ---
      const decorMat = new THREE.MeshLambertMaterial({ vertexColors: true });
      coords.forEach((c, i) => {
        let geo = null;
        if (cellCity[i]) geo = buildSettlementDecorGeo(cellCity[i].emoji);
        else if (cellOasis[i]) geo = buildOasisDecorGeo();
        if (geo) {
          const mesh = new THREE.Mesh(geo, decorMat);
          mesh.position.set(worldX[i], trueH[i], worldZ[i]);
          mesh.raycast = () => {};
          scene.add(mesh);
          decorByIdx[i] = mesh;
        }
      });

      // --- caravan (🐪 billboard, always on top, like 2D draw order) ---
      caravan = makeBillboard(makeEmojiTexture('🐪', 176, 256), 0.95, 0.95, 11, false);
      const startIdx = idxByKey.get('0,0');
      caravan.position.set(worldX[startIdx], trueH[startIdx] + 0.42, worldZ[startIdx]);
      caravanTo.copy(caravan.position);
      caravanFrom.copy(caravan.position);
      scene.add(caravan);

      // --- decals ---
      const decalMatOpts = { transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1 };
      hexRingGeo = buildHexAnnulusGeometry(1.0, 0.88);       // current-hex 4px-border analog
      hexRingThinGeo = buildHexAnnulusGeometry(1.0, 0.94);   // hover ring
      currentAnnulus = new THREE.Mesh(hexRingGeo, new THREE.MeshBasicMaterial({ color: 0xcc9a00, ...decalMatOpts }));
      currentAnnulus.renderOrder = 5;
      currentAnnulus.raycast = () => {};
      scene.add(currentAnnulus);
      hoverRing = new THREE.Mesh(hexRingThinGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color('#e8c46b'), opacity: 0.35, ...decalMatOpts }));
      hoverRing.renderOrder = 6;
      hoverRing.visible = false;
      hoverRing.raycast = () => {};
      scene.add(hoverRing);
      goldRing = new THREE.Mesh(new THREE.RingGeometry(S / 2 - 0.0375, S / 2 + 0.0375, 40).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: new THREE.Color('gold'), ...decalMatOpts }));
      goldRing.renderOrder = 7;
      goldRing.visible = false;
      goldRing.raycast = () => {};
      scene.add(goldRing);
      redDot = new THREE.Mesh(new THREE.CircleGeometry(0.125 * S, 24).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0xff0000, ...decalMatOpts }));
      redDot.renderOrder = 8;
      redDot.visible = false;
      redDot.raycast = () => {};
      scene.add(redDot);
      // Wear-ring geometries: 4 thickness tiers (2D lineWidth 1..4px, ÷40 px/world)
      wearRingGeos = [1, 2, 3, 4].map(px => {
        const t = px / 40;
        return new THREE.RingGeometry(0.3 * S - t / 2, 0.3 * S + t / 2, 32).rotateX(-Math.PI / 2);
      });

      // --- AI-generated textures (async + optional) ---
      // GAME_TEXTURES is a window global defined by the classic script above.
      // All wiring is fire-and-forget: the scene renders correctly before any
      // load completes, and a decode failure leaves the game fully playable.
      try {
        const texSrc = window.GAME_TEXTURES || {};
        const texLoader = new THREE.TextureLoader();
        // Hex-top grain: neutral luminance detail map derived from the sand
        // texture (desaturated, mean normalized to ~0.78 of full white). The
        // per-instance colors stay the dominant channel — pale desert, pink
        // current tile, gray fog — the map only multiplies in subtle grain.
        if (texSrc.sand) texLoader.load(texSrc.sand, (tex) => {
          const img = tex.image;
          const cv = document.createElement('canvas');
          cv.width = img.width; cv.height = img.height;
          const cx = cv.getContext('2d');
          cx.drawImage(img, 0, 0);
          const imgData = cx.getImageData(0, 0, cv.width, cv.height);
          const d = imgData.data;
          let sum = 0;
          for (let i = 0; i < d.length; i += 4) {
            const l = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
            d[i] = d[i + 1] = d[i + 2] = l;
            sum += l;
          }
          const mean = sum / (d.length / 4);
          const gain = mean > 0 ? (0.78 * 255) / mean : 1;
          for (let i = 0; i < d.length; i += 4) {
            const l = Math.min(255, d[i] * gain);
            d[i] = d[i + 1] = d[i + 2] = l;
          }
          cx.putImageData(imgData, 0, 0);
          tex.dispose();
          const detail = new THREE.CanvasTexture(cv);
          detail.wrapS = detail.wrapT = THREE.MirroredRepeatWrapping;
          topMat.map = detail;
          topMat.needsUpdate = true;
        });
        // Water surface texture (multiplies with material color, so lighten
        // the base blue enough for the texture to read).
        if (texSrc.water) texLoader.load(texSrc.water, (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.wrapS = tex.wrapT = THREE.MirroredRepeatWrapping;
          waterMat.map = tex;
          waterMat.color.setStyle('#cfe6f2');
          waterMat.needsUpdate = true;
        });
        // Equirectangular sky; once this replaces the color background,
        // tickAnimations drives day/night via scene.backgroundIntensity.
        if (texSrc.sky) texLoader.load(texSrc.sky, (tex) => {
          tex.mapping = THREE.EquirectangularReflectionMapping;
          tex.colorSpace = THREE.SRGBColorSpace;
          scene.background = tex;
        });
        // Parchment UI panels (multiply-blended over the existing light
        // background colors so text contrast is preserved).
        if (texSrc.parchment) {
          for (const panelId of ['sidebar', 'guild-panel']) {
            const el = document.getElementById(panelId);
            if (!el) continue;
            // White gradient layer joins the multiply stack and lifts the
            // parchment toward white, keeping small gray text at AA contrast.
            el.style.backgroundImage =
              'linear-gradient(rgba(255,255,255,0.45), rgba(255,255,255,0.45)), url(' + texSrc.parchment + ')';
            el.style.backgroundSize = 'auto, 512px';
            el.style.backgroundBlendMode = 'normal, multiply';
          }
        }
      } catch (e) { /* textures are cosmetic only — never block boot */ }

      // --- input ---
      setupInput();

      // --- resize handling ---
      const ro = new ResizeObserver(onResize);
      ro.observe(mapEl);
      window.addEventListener('resize', onResize);

      viewReady = true;
      onResize();
      return true;
    }

    function onResize() {
      if (!viewReady && !renderer) return;
      const w = mapEl.clientWidth, h = mapEl.clientHeight;
      if (!w || !h) return;
      renderer.setPixelRatio(Math.min(devicePixelRatio, govRung >= 2 ? 1 : govRung >= 1 ? 1.5 : 2));
      renderer.setSize(w, h, false);
      fitFrustum();
    }

    function fitFrustum() {
      const w = mapEl.clientWidth || 1, h = mapEl.clientHeight || 1;
      const s = PX_PER_WORLD * viewZoom;
      camera.right = (w / 2) / s;
      camera.left = -camera.right;
      camera.top = (h / 2) / s;
      camera.bottom = -camera.top;
      camera.updateProjectionMatrix();
    }

    function onZoomChanged(instant) {
      // 2D parity: zooming never recenters on the caravan; at 2x the view
      // shifts only if the caravan would otherwise sit outside it.
      edgeScrollCamera(caravan.position.x, caravan.position.z);
      if (instant) {
        viewZoom = state.zoom;
        camTarget.copy(camGoal);
        fitFrustum();
        updateCameraPosition();
      }
      // otherwise the frame loop eases viewZoom toward state.zoom
    }

    // 2D-parity camera: the view stays put. At 2x it pans only when the
    // caravan reaches the margin of the visible area, and only far enough
    // to keep it inside (edge scroll). Half-extents are computed for the
    // TARGET zoom so a check during the zoom ease lands correctly.
    function edgeScrollCamera(x, z) {
      if (state.zoom === 1) { camGoal.set(0, 0, 0); return; }
      const w = mapEl.clientWidth || 1, h = mapEl.clientHeight || 1;
      const s = PX_PER_WORLD * state.zoom;
      const margin = 2.2 * S;   // keep the caravan ~a hex inside the view edge
      const halfW = Math.max((w / 2) / s - margin, S);
      const halfZ = Math.max((h / 2) / s / Math.sin(CAM_ELEV) - margin, S);
      const dx = x - camGoal.x, dz = z - camGoal.z;
      if (dx > halfW) camGoal.x = x - halfW;
      else if (dx < -halfW) camGoal.x = x + halfW;
      if (dz > halfZ) camGoal.z = z - halfZ;
      else if (dz < -halfZ) camGoal.z = z + halfZ;
      camGoal.x = THREE.MathUtils.clamp(camGoal.x, -11, 11);
      camGoal.z = THREE.MathUtils.clamp(camGoal.z, -10, 10);
    }

    function updateCameraPosition() {
      // Fixed azimuth: camera south of target, looking north; north = -Z is up-screen.
      _v.set(0, Math.sin(CAM_ELEV), Math.cos(CAM_ELEV));
      camera.position.copy(camTarget).addScaledVector(_v, CAM_DIST);
      camera.lookAt(camTarget);
    }

    // ---------------------------------------------------------------
    // §H  Input: hybrid picking, click vs pan, hover
    // ---------------------------------------------------------------
    function pickHex(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      ndc.set((clientX - rect.left) / rect.width * 2 - 1,
              -((clientY - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      rayHits.length = 0;
      raycaster.intersectObject(tilesIM, false, rayHits);
      if (rayHits.length) return coords[rayHits[0].instanceId];
      const p = raycaster.ray.intersectPlane(GROUND_PLANE, _v);
      return p ? worldToHex(p.x, p.z) : null;
    }

    function isHexVisibleNow(c) {
      const viewDist = getViewDistance();
      let isVisible = hexDistance(c, state.pos) <= viewDist;
      if (!isVisible) {
        for (const cityName of state.guildEffects.revealedCities) {
          const revealedCity = cityByName[cityName];
          if (revealedCity && hexDistance(c, revealedCity) <= 5) { isVisible = true; break; }
        }
        if (!isVisible && state.guildEffects.oasisMapRevealed && getOasis(c.q, c.r)) isVisible = true;
      }
      return isVisible;
    }

    function displayTop(hex) {
      const idx = idxByKey.get(`${hex.q},${hex.r}`);
      if (idx === undefined) return H_DESERT;
      if (!isHexVisibleNow(coords[idx])) return H_FOG;
      // Water tiles: place decals at the water surface, not the submerged
      // prism top (H_WATER), mirroring the other water decal special cases.
      return cellWater[idx] ? WATER_Y : trueH[idx];
    }

    function showClickMarker(hex) {
      hexToWorld(hex.q, hex.r, _v);
      redDot.position.set(_v.x, displayTop(hex) + 0.012, _v.z);
      redDot.visible = true;
      clickT = 0.2;
    }

    function handleClick(e) {
      const hex = pickHex(e.clientX, e.clientY);
      if (!hex) return;
      showClickMarker(hex);
      setTimeout(() => drawMap(), 200);   // verbatim call site (shim)
      moveToHex(hex.q, hex.r);
    }

    function setupInput() {
      const dom = renderer.domElement;
      let isDown = false, panning = false, downX = 0, downY = 0, lastX = 0, lastY = 0;

      dom.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        isDown = true; panning = false;
        downX = lastX = e.clientX;
        downY = lastY = e.clientY;
        dom.setPointerCapture(e.pointerId);
      });

      dom.addEventListener('pointermove', e => {
        if (isDown) {
          const totalDx = e.clientX - downX, totalDy = e.clientY - downY;
          if (!panning && Math.hypot(totalDx, totalDy) > 6 && state.zoom === 2) panning = true;
          if (panning) {
            const upp = (camera.right - camera.left) / (dom.clientWidth || 1);
            camGoal.x = THREE.MathUtils.clamp(camGoal.x - (e.clientX - lastX) * upp, -11, 11);
            camGoal.z = THREE.MathUtils.clamp(camGoal.z - (e.clientY - lastY) * upp / Math.sin(CAM_ELEV), -10, 10);
            camTarget.copy(camGoal);   // manual pan is immediate, no ease
          }
          lastX = e.clientX; lastY = e.clientY;
        }
        hoverX = e.clientX; hoverY = e.clientY;
        hoverInside = true;
        hoverPending = true;
      });

      dom.addEventListener('pointerup', e => {
        if (!isDown) return;
        isDown = false;
        const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
        const wasPanning = panning;
        panning = false;
        // At zoom 1 panning never engages, so a >6px drift has nothing else to
        // mean — treat it as a click (2D parity: its click listener always fires).
        if (!wasPanning && (moved <= 6 || state.zoom === 1)) handleClick(e);
      });

      dom.addEventListener('pointercancel', () => {
        // Browser claimed the gesture (native touch pan/zoom etc.): abort the
        // drag state machine like pointerup would, minus the click dispatch.
        isDown = false;
        panning = false;
        hoverInside = false;
        hoverPending = false;
        hoverRing.visible = false;
        dom.style.cursor = '';
      });

      dom.addEventListener('pointerleave', () => {
        hoverInside = false;
        hoverPending = false;   // drop any queued update from a same-frame pointermove
        hoverRing.visible = false;
        dom.style.cursor = '';
      });
    }

    function updateHover() {
      const dom = renderer.domElement;
      if (!hoverInside) {   // pointer left the map; never re-show from stale coords
        hoverRing.visible = false;
        dom.style.cursor = '';
        return;
      }
      const hex = pickHex(hoverX, hoverY);
      let show = false;
      if (hex) {
        const idx = idxByKey.get(`${hex.q},${hex.r}`);
        if (idx !== undefined && hexDistance(hex, state.pos) === 1) {
          hexToWorld(hex.q, hex.r, _v);
          hoverRing.position.set(_v.x, displayTop(hex) + 0.005, _v.z);
          show = true;
        }
      }
      hoverRing.visible = show;
      dom.style.cursor = show ? 'pointer' : '';
    }

    // ---------------------------------------------------------------
    // §G  syncVisuals — state → scene, one pass, O(127)
    // ---------------------------------------------------------------
    function syncVisuals() {
      const nowKey = `${state.pos.q},${state.pos.r}`;

      for (let i = 0; i < coords.length; i++) {
        const c = coords[i];
        const visible = isHexVisibleNow(c);
        const current = (c.q === state.pos.q && c.r === state.pos.r);
        const pathWear = getPathWear(c.q, c.r);
        const h = visible ? trueH[i] : H_FOG;

        // fill color (exact 2D palette)
        if (!visible) {
          _c.copy(COL_FOG_FILL);
        } else if (cellCity[i]) {
          _c.copy(current ? COL_FILL_CITY_CUR : COL_FILL_CITY);
        } else if (cellOasis[i]) {
          _c.copy(current ? COL_FILL_OASIS_CUR : COL_FILL_OASIS);
        } else if (cellWater[i]) {
          _c.copy(current ? COL_FILL_WATER_CUR : COL_FILL_WATER);
        } else {
          const base = current ? DESERT_BASE_CUR : DESERT_BASE;
          if (pathWear > 0) {
            // exact sRGB-integer wear blend, per 2D formula
            const wearIntensity = pathWear / 200;
            const nr = Math.round(base[0] + (BROWN[0] - base[0]) * wearIntensity * 0.4);
            const ng = Math.round(base[1] + (BROWN[1] - base[1]) * wearIntensity * 0.4);
            const nb = Math.round(base[2] + (BROWN[2] - base[2]) * wearIntensity * 0.4);
            _c.setRGB(nr / 255, ng / 255, nb / 255, THREE.SRGBColorSpace);
          } else {
            _c.setRGB(base[0] / 255, base[1] / 255, base[2] / 255, THREE.SRGBColorSpace);
          }
        }
        tilesIM.setColorAt(i, _c);

        // matrix (fog flattens everything to desert height — no silhouette leak)
        _m.makeScale(1, h, 1);
        _m.setPosition(worldX[i], 0, worldZ[i]);
        tilesIM.setMatrixAt(i, _m);

        // outline color + heights
        const strokeCol = !visible ? COL_STROKE_FOG
          : cellCity[i] ? COL_STROKE_CITY
          : cellOasis[i] ? COL_STROKE_OASIS
          : cellWater[i] ? COL_STROKE_WATER
          : COL_STROKE_DESERT;
        const lineY = (visible && cellWater[i]) ? WATER_Y + 0.004 : h + 0.002;
        const vBase = i * 12;
        for (let k = 0; k < 6; k++) {
          const a = HEX_CORNERS[k], b = HEX_CORNERS[(k + 1) % 6];
          const o = (vBase + k * 2) * 3;
          outlinePos.array[o] = worldX[i] + a.x;
          outlinePos.array[o + 1] = lineY;
          outlinePos.array[o + 2] = worldZ[i] + a.z;
          outlinePos.array[o + 3] = worldX[i] + b.x;
          outlinePos.array[o + 4] = lineY;
          outlinePos.array[o + 5] = worldZ[i] + b.z;
          outlineCol.array[o] = strokeCol.r;
          outlineCol.array[o + 1] = strokeCol.g;
          outlineCol.array[o + 2] = strokeCol.b;
          outlineCol.array[o + 3] = strokeCol.r;
          outlineCol.array[o + 4] = strokeCol.g;
          outlineCol.array[o + 5] = strokeCol.b;
        }

        // fog checklist: labels, decor, water surface
        if (labelByIdx[i]) labelByIdx[i].visible = visible;
        if (decorByIdx[i]) decorByIdx[i].visible = visible;
        if (waterMeshByIdx[i]) waterMeshByIdx[i].visible = visible;

        // wear ring (wear > 20, any terrain, visible only)
        if (pathWear > 20 && visible) {
          let ring = wearRingByIdx[i];
          const tier = Math.min(3, Math.max(0, Math.round(Math.max(1, pathWear / 50)) - 1));
          if (!ring) {
            ring = new THREE.Mesh(wearRingGeos[tier], new THREE.MeshBasicMaterial({
              color: new THREE.Color('#8b4513'), transparent: true, depthWrite: false,
              polygonOffset: true, polygonOffsetFactor: -1
            }));
            ring.renderOrder = 4;
            ring.raycast = () => {};
            scene.add(ring);
            wearRingByIdx[i] = ring;
          }
          ring.geometry = wearRingGeos[tier];
          ring.material.opacity = Math.min(0.8, pathWear / 200);
          ring.position.set(worldX[i], ((visible && cellWater[i]) ? WATER_Y : h) + 0.004, worldZ[i]);
          ring.visible = true;
        } else if (wearRingByIdx[i]) {
          wearRingByIdx[i].visible = false;
        }
      }
      tilesIM.instanceColor.needsUpdate = true;
      tilesIM.instanceMatrix.needsUpdate = true;
      outlinePos.needsUpdate = true;
      outlineCol.needsUpdate = true;

      // current-hex annulus (the 2D 4px border), recolored to the terrain stroke
      const curIdx = idxByKey.get(nowKey);
      const curStroke = cellCity[curIdx] ? COL_STROKE_CITY
        : cellOasis[curIdx] ? COL_STROKE_OASIS
        : cellWater[curIdx] ? COL_STROKE_WATER
        : COL_STROKE_DESERT;
      currentAnnulus.material.color.copy(curStroke);
      const curTopY = cellWater[curIdx] ? WATER_Y : trueH[curIdx];
      currentAnnulus.position.set(worldX[curIdx], curTopY + 0.006, worldZ[curIdx]);

      // caravan tween on position change
      if (nowKey !== lastSyncedPosKey) {
        lastSyncedPosKey = nowKey;
        caravanFrom.copy(caravan.position);
        caravanTo.set(worldX[curIdx], trueH[curIdx] + 0.42, worldZ[curIdx]);
        caravanT = 0;
        edgeScrollCamera(caravanTo.x, caravanTo.z);   // pan only if the move hits the view edge
      } else {
        caravanTo.set(worldX[curIdx], trueH[curIdx] + 0.42, worldZ[curIdx]);
      }

      // gold last-move ring: read + null lastMove here (2D parity: nulled in draw)
      if (lastMove) {
        const lmIdx = idxByKey.get(`${lastMove.q},${lastMove.r}`);
        if (lmIdx !== undefined) {
          const lmY = cellWater[lmIdx] ? WATER_Y : trueH[lmIdx];
          goldRing.position.set(worldX[lmIdx], lmY + 0.01, worldZ[lmIdx]);
          goldRing.visible = true;
          goldT = 0.2;
        }
        lastMove = null;
      }

      // Game state changed under a possibly stationary pointer (click-move,
      // zoom toggle, reveal items): re-run updateHover next frame so the ring
      // and cursor never go stale. hoverX/hoverY hold the last pointer spot;
      // the hoverInside guard keeps this inert while the pointer is off-map.
      hoverPending = true;
    }

    // ---------------------------------------------------------------
    // §I  Frame loop, animations, atmosphere, governor
    // ---------------------------------------------------------------
    const clock = new THREE.Clock();

    function tickAnimations(dt) {
      elapsed += dt;

      // zoom frustum ease
      if (Math.abs(viewZoom - state.zoom) > 0.0005) {
        viewZoom += (state.zoom - viewZoom) * Math.min(1, dt * 10);
        if (Math.abs(viewZoom - state.zoom) <= 0.0005) viewZoom = state.zoom;
        fitFrustum();
      }

      // caravan tween + idle bob
      if (caravanT < 1) {
        caravanT = Math.min(1, caravanT + dt / caravanDur);
        const u = caravanT * caravanT * (3 - 2 * caravanT);
        caravan.position.lerpVectors(caravanFrom, caravanTo, u);
        caravan.position.y += 0.10 * Math.sin(Math.PI * u);
      } else {
        caravan.position.copy(caravanTo);
        caravan.position.y += 0.02 * Math.sin(elapsed * 2);
      }

      // camera: ease toward the edge-scroll goal (2D parity: no follow)
      camTarget.lerp(camGoal, 1 - Math.exp(-5 * dt));
      updateCameraPosition();

      // decal countdowns (clamped dt — deterministic under tab throttling)
      if (goldT > 0) { goldT -= dt; if (goldT <= 0) goldRing.visible = false; }
      if (clickT > 0) { clickT -= dt; if (clickT <= 0) redDot.visible = false; }

      // visualHour eased toward game time (hour 0 = dawn)
      const targetHour = state.time % HOURS_PER_DAY;
      let diff = ((targetHour - visualHour) % 24 + 24) % 24;
      if (diff > 0.0001) {
        visualHour = (visualHour + Math.min(diff, dt * Math.max(1, diff))) % 24;
      }

      // day/night: sky + side light hue; board albedo floored at 85%
      const th = 2 * Math.PI * visualHour / 24;
      const elev = Math.sin(th);
      const dayF = THREE.MathUtils.smoothstep(elev, -0.05, 0.30);
      const duskF = Math.pow(THREE.MathUtils.clamp(1 - Math.abs(elev) * 3, 0, 1), 2);
      sunLight.position.set(30 * Math.cos(th), Math.max(30 * elev, 4), -12);
      sunLight.intensity = 0.2 + 1.0 * dayF;
      _c.copy(SUN_NIGHT).lerp(SUN_DAY, dayF).lerp(SUN_DUSK, duskF * 0.7);
      sunLight.color.copy(_c);
      // Sky: before the equirect sky texture loads, scene.background is a
      // color and gets the old day/night lerp; once the texture is in,
      // backgroundIntensity carries the day/night cycle instead.
      if (scene.background.isColor) {
        _c2.copy(BG_NIGHT).lerp(BG_DAY, dayF).lerp(BG_DUSK, duskF * 0.85);
        scene.background.copy(_c2);
      } else {
        scene.backgroundIntensity = 0.25 + 0.75 * dayF;
      }
      const lightLevel = 0.85 + 0.15 * dayF;   // readability floor: never below 0.85
      topMat.color.setScalar(lightLevel);
      lineMat.color.setScalar(lightLevel);

      // water time
      if (!waterFrozen) uTime.value = elapsed;

      // hover (raycast at most once per rendered frame)
      if (hoverPending) {
        hoverPending = false;
        updateHover();
      }
    }

    function perfGovernor(dt) {
      emaDt = 0.9 * emaDt + 0.1 * dt;
      govCheckT += dt;
      if (govCheckT < 1) return;
      govCheckT = 0;
      if (emaDt > 0.04) {
        govBadCount++;
        if (govBadCount >= 3 && elapsed - govLastChange > 2 && govRung < 3) {
          govRung++;
          govLastChange = elapsed;
          govBadCount = 0;
          if (govRung === 3) { waterFrozen = true; caravanDur = 0.12; }
          onResize();
        }
      } else {
        govBadCount = 0;
      }
    }

    function frame() {
      requestAnimationFrame(frame);
      const dt = Math.min(clock.getDelta(), 0.1);
      if (viewDirty) { viewDirty = false; syncVisuals(); }
      tickAnimations(dt);
      perfGovernor(dt);
      if (!ctxLost) renderer.render(scene, camera);
    }

    // ================================================================
    // §J  Boot
    // ================================================================
    const viewOk = initView();
    initializeGame();
    if (viewOk) frame();
  </script>
</body>
</html>
